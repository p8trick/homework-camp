<style>
  :root{
    --grass:#5B8C3A; --grass-dark:#3F6528; --dirt:#8B5A2B; --dirt-dark:#6B4420;
    --stone:#7D7D7D; --sky:#7EC8E3; --diamond:#4FD8E8; --gold:#F2C14E;
    --night:#1C2541; --ink:#22201B; --paper:#FAF7F0; --danger:#D9534F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--sky);
    background-image:linear-gradient(180deg, var(--sky) 0%, var(--sky) 60%, var(--grass) 60%, var(--grass) 100%);
    font-family:'Baloo 2', system-ui, sans-serif; color:var(--ink);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:calc(env(safe-area-inset-top) + 6px) 12px 32px; overflow-x:hidden; position:relative;
  }
  .pixel{font-family:'Press Start 2P', monospace;}

  /* ---------- Header row: title centered, gear at right, no lopsided whitespace ---------- */
  .header-row{
    width:100%; max-width:480px; display:grid;
    grid-template-columns:32px 1fr 32px; align-items:center;
    margin-bottom:14px;
  }
  .gear-btn{
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    font-size:16px; background:var(--paper); border:2px solid var(--ink);
    box-shadow:2px 2px 0 rgba(0,0,0,.3); cursor:pointer;
  }
  header{ text-align:center; }
  header h1{ font-size:15px; line-height:1.6; margin:0; color:var(--paper); text-shadow:2px 2px 0 var(--night); }

  .back-btn{
    display:block; width:100%; max-width:480px; text-align:left;
    font-size:13px; font-weight:800; color:var(--stone);
    background:none; border:none; cursor:pointer;
    margin-bottom:10px; padding:4px 0;
  }

  #homePage{ width:100%; display:flex; flex-direction:column; align-items:center; }

  .cal-wrap{
    width:100%; max-width:480px; background:rgba(255,255,255,.5);
    border:3px solid var(--ink); padding:10px; margin-bottom:14px;
  }
  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .cal-nav button{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:16px;
    background:var(--paper); border:2px solid var(--ink); width:30px; height:30px; cursor:pointer;
  }
  .cal-nav button:disabled{opacity:.3; cursor:default;}
  .cal-month-label{font-weight:800; font-size:13px;}
  .cal-weekdays, .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-weekdays div{ text-align:center; font-size:10px; font-weight:800; color:var(--stone); }
  .cal-cell{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    position:relative; font-size:11px; font-weight:700; border:2px solid transparent;
  }
  .cal-cell.blank{visibility:hidden;}
  .cal-cell.future{color:rgba(0,0,0,.25);}
  .cal-cell.missed{background:rgba(0,0,0,.08); border-color:rgba(0,0,0,.15);}
  .cal-cell.done{background:var(--gold); border-color:var(--dirt-dark); cursor:pointer; color:var(--ink);}
  .cal-cell.today{outline:2px dashed var(--night); outline-offset:1px; cursor:pointer; background:var(--diamond);}
  .cal-cell .stardot{position:absolute; bottom:1px; font-size:6px;}
  .cal-cell .reactiondot{position:absolute; top:-3px; right:-3px; font-size:11px; line-height:1; filter:drop-shadow(0 1px 1px rgba(0,0,0,.3));}

  .home-columns{ width:100%; max-width:480px; display:flex; flex-direction:column; }
  .home-columns > .cal-wrap, .home-columns > .card{ margin-bottom:14px; }

  .card{
    width:100%; max-width:480px; background:var(--paper); border:4px solid var(--ink);
    box-shadow:6px 6px 0 rgba(0,0,0,.3); padding:18px; margin-bottom:14px;
  }
  .progress-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-weight:700; font-size:13px; color:var(--stone); }
  .timer-badge{ font-weight:800; font-size:12px; color:var(--night); background:var(--sky); border:2px solid var(--ink); padding:2px 8px; }
  .subject-tag{ display:inline-block; padding:3px 10px; font-size:11px; font-weight:800; border:2px solid var(--ink); background:var(--sky); }
  .subject-tag.math{background:var(--gold);}

  .question-box{ text-align:center; margin:18px 0; }
  .qtext{ font-size:26px; font-weight:800; line-height:1.4; word-break:break-word; }
  .speak-btn{
    display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; margin-top:8px;
    background:var(--diamond); border:3px solid var(--ink); font-size:18px; cursor:pointer;
  }
  .speak-btn:active{transform:translate(2px,2px);}

  .options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
  .opt-btn{
    padding:16px 8px; font-size:20px; font-weight:700; font-family:'Baloo 2', sans-serif;
    background:var(--paper); border:3px solid var(--ink); box-shadow:3px 3px 0 rgba(0,0,0,.25);
    cursor:pointer; min-height:56px;
  }
  .opt-btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,.25);}
  .opt-btn.correct{background:var(--grass); color:var(--paper); border-color:var(--grass-dark);}
  .opt-btn.wrong{background:var(--danger); color:var(--paper);}
  .opt-btn.selected{background:var(--diamond); border-color:var(--night);}
  .opt-btn:disabled{opacity:.55;}

  .feedback{ text-align:center; min-height:26px; font-weight:800; font-size:15px; margin-top:10px; }
  .feedback.good{color:var(--grass-dark);} .feedback.bad{color:var(--danger);}

  .backpack{
    width:100%; max-width:480px; background:var(--dirt); border:4px solid var(--ink);
    box-shadow:6px 6px 0 rgba(0,0,0,.3); padding:12px 14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .backpack .label{ color:var(--paper); font-weight:800; font-size:12px; margin-right:4px; flex-basis:100%; }
  .loot{ width:34px; height:34px; display:flex; align-items:center; justify-content:center; font-size:18px; background:var(--night); border:2px solid var(--ink); }
  .loot.empty{opacity:.25;}

  .home{ text-align:center; }
  .streak-big{ font-size:34px; font-weight:800; margin:6px 0 2px; }
  .best-streak{ font-size:12px; font-weight:700; color:var(--stone); margin-bottom:14px; }
  .badge-row{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-bottom:16px; }
  .badge-chip{
    font-size:18px; width:34px; height:34px; display:flex; align-items:center; justify-content:center;

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDFnnLxYvmW-_E9h3T_jPDoZhi7aqOLkJQ",
    authDomain: "homework-471fb.firebaseapp.com",
    projectId: "homework-471fb",
    storageBucket: "homework-471fb.firebasestorage.app",
    messagingSenderId: "40029482214",
    appId: "1:40029482214:web:57de9642cd5102234bdf27"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let authReadyResolve;
  const authReady = new Promise(res => { authReadyResolve = res; });
  onAuthStateChanged(auth, user => { if(user) authReadyResolve(); });
  signInAnonymously(auth).catch(err => console.warn("Anonymous sign-in failed:", err));

  let unsubscribe = null;

  window.CampSync = {
    // Push this device's local days/meta up to the cloud doc for this pairing code.
    async push(pairCode, payload){
      if(!pairCode) return;
      await authReady;
      try{
        await setDoc(doc(db, "camps", pairCode), payload, { merge: true });
      }catch(e){ console.warn("CampSync.push failed:", e); }
    },
    // One-time fetch (used right after entering a pairing code, to pull existing history).
    async pull(pairCode){
      if(!pairCode) return null;
      await authReady;
      try{
        const snap = await getDoc(doc(db, "camps", pairCode));
        return snap.exists() ? snap.data() : null;
      }catch(e){ console.warn("CampSync.pull failed:", e); return null; }
    },
    // Live subscription: fires immediately with current data, then again on every change.
    subscribe(pairCode, cb){
      if(unsubscribe){ unsubscribe(); unsubscribe = null; }
      if(!pairCode) return;
      authReady.then(()=>{
        unsubscribe = onSnapshot(doc(db, "camps", pairCode), snap=>{
          cb(snap.exists() ? snap.data() : null);
        }, err => console.warn("CampSync.subscribe error:", err));
      });
    },
    // Explicitly remove one day's entry from the cloud doc. setDoc(...,{merge:true}) (used by
    // push()) can only add or overwrite fields, never delete one — a key missing from the
    // payload is left untouched in the existing doc. This uses updateDoc + deleteField() for
    // a real removal, and stamps a resetSignal so other subscribed devices know to drop their
    // own local copy of this day too (the normal merge-in logic only ever adds days it's
    // missing locally, it never removes a day already present).
    async deleteDay(pairCode, dayKey){
      if(!pairCode) return;
      await authReady;
      try{
        await updateDoc(doc(db, "camps", pairCode), {
          [`days.${dayKey}`]: deleteField(),
          resetSignal: { key: dayKey, ts: Date.now() }
        });
      }catch(e){ console.warn("CampSync.deleteDay failed:", e); }
    }
  };
  window.dispatchEvent(new Event("campsync-ready"));
</script>

  // real, simple words the app already treats as known-level vocabulary.
  const LISTEN_PAIRS = [
    ["cat",["cot","cut"]],["hot",["hit","hat","hut"]],["bag",["big","bug"]],
    ["pin",["pen","pan"]],["bed",["bad","bud"]],["top",["tip","tap"]],

  function recentEnKeys(){
    const cutoff = Date.now() - RECENT_DAYS*24*3600*1000;
    return new Set(state.usedLog.en.filter(e=>e.ts>=cutoff).map(e=>e.key));
  }
  function logEnUsed(keys){
    const cutoff = Date.now() - (RECENT_DAYS+10)*24*3600*1000;
    state.usedLog.en = state.usedLog.en.filter(e=>e.ts>=cutoff);
    keys.forEach(k=> state.usedLog.en.push({ ts: Date.now(), key:k }));
  }

  // Difficulty scales two ways as level rises: which content pool is used, AND how many
  // answer options are offered. Option count is capped per-type by how many honest
  // distractors actually exist for that type (see poolCapFor).
  function optionCountFor(level, cap){
    const target = level<=1 ? 4 : level===2 ? 5 : 6;
    return Math.min(target, cap);
  }
  function poolCapFor(level){
    if(level<=2) return 6; // sight-word / listen-discrimination: plenty of distractors available
    if(level<=4) return 5; // missing-letter: only 5 vowels exist, honest cap is 5
    if(level===5) return 6; // blends (22 in BLEND_LIST) / CVCe (vowel-limited to 5, self-caps regardless)
    return 6;              // sentence-fill: shared grammar bank supports 6
  }
  function buildOptions(correct, wrongCandidates, count){
    const uniqueWrong = Array.from(new Set(wrongCandidates.filter(w=>w!==correct)));
    const chosen = uniqueWrong.sort(()=>Math.random()-0.5).slice(0, Math.max(0,count-1));
    return [correct, ...chosen].sort(()=>Math.random()-0.5);
  }

  function poolForLevel(level){
    if(level<=2) return { pool:LV1_POOL, keyFn:it=>it.row[0], make:(it,optCount)=>makeLv1Question(it,optCount) };
    if(level<=4) return { pool:MISSING_LETTER, keyFn:w=>w[3], make:makeLetterQuestion };
    if(level===5) return { pool:LV5_POOL, keyFn:it=>it.kind==='blend'?it.row[2]:it.row[3], make:(it,optCount)=>makeLv5Question(it,optCount) };
    return { pool:SENTENCE_FILL, keyFn:w=>w[0], make:makeSentenceQuestion };
  }
  function makeSightQuestion(row, optCount){
    const [word, emoji] = row;
    const wrongPool = SIGHT_WORDS.filter(w=>w[1]!==emoji).map(w=>w[1]);
    const opts = buildOptions(emoji, wrongPool, optCount);
    return { subject:"en", prompt: word, speak: word, options: opts, answer: emoji, big:true };
  }
  function makeListenQuestion(row){
    const [word, distractors] = row;
    const opts = [word, ...distractors].sort(()=>Math.random()-0.5);
    // No option cap needed: options are spoken-only buttons ("🔊 1/2/3"), never shown as
    // text, so there's no reading-difficulty tradeoff the way there is for text options.
    return { subject:"en", type:"listen", prompt: word, speak: null, options: opts, answer: word };
  }
  // Level 1-2 mixes two listening skills: picture-match (existing) and sound discrimination
  // (new) — both are fundamentally "hear it, don't just read it" skills, so grouping them
  // keeps the level ladder from growing an extra number for what's really the same tier.
  const LV1_POOL = [
    ...SIGHT_WORDS.map(row=>({kind:"sight", row})),
    ...LISTEN_PAIRS.map(row=>({kind:"listen", row}))
  ];
  function makeLv1Question(item, optCount){
    return item.kind === "sight" ? makeSightQuestion(item.row, optCount) : makeListenQuestion(item.row);
  }
  function makeLetterQuestion(row, optCount){
    const [word, right, wrong, full] = row;
    const vowels = ["a","e","i","o","u"];
    const wrongPool = Array.from(new Set([wrong, ...vowels.filter(v=>v!==right)]));
    const opts = buildOptions(right, wrongPool, optCount);
    return { subject:"en", prompt: word, speak: full, options: opts, answer: right };
  }
  function makeBlendQuestion(row, optCount){
    const [word, right, full] = row;
    const wrongPool = BLEND_LIST.filter(b=>b!==right);
    const opts = buildOptions(right, wrongPool, optCount);
    return { subject:"en", prompt: word, speak: full, options: opts, answer: right };
  }
  // Level 5 mixes consonant blends and long-vowel silent-e words — two different decoding
  // skills at a similar difficulty, right above CVC (levels 3-4) and below full sentence
  // grammar (level 6).
  const LV5_POOL = [
    ...BLEND_WORDS.map(row=>({kind:"blend", row})),
    ...CVCE_WORDS.map(row=>({kind:"cvce", row}))
  ];
  function makeLv5Question(item, optCount){
    return item.kind === "blend" ? makeBlendQuestion(item.row, optCount) : makeLetterQuestion(item.row, optCount);
  }
  function makeSentenceQuestion(row, optCount){
    const [sentence, right, wrong] = row;
    const wrongPool = Array.from(new Set([wrong, ...GRAMMAR_BANK.filter(w=>w!==right)]));
    const opts = buildOptions(right, wrongPool, optCount);
    return { subject:"en", prompt: sentence, speak: sentence.replace("___", right), options: opts, answer: right };
  }

  function buildEnglishItems(level, qCount){
    const { pool, keyFn, make } = poolForLevel(level);
    const recent = recentEnKeys();
    let avail = pool.filter(row=>!recent.has(keyFn(row)));
    if(avail.length < qCount) avail = pool.slice(); // pool exhausted for this window: allow repeats
    const chosen = avail.sort(()=>Math.random()-0.5).slice(0, qCount);
    logEnUsed(chosen.map(keyFn));
    const optCount = optionCountFor(level, poolCapFor(level));
    return chosen.map(row=>make(row, optCount));
  }

  function genMathOne(level){
    function mkAdd(max){ const a=1+Math.floor(Math.random()*max), b=1+Math.floor(Math.random()*max); return { prompt:`${a} + ${b} = ?`, answer:(a+b) }; }
    function mkSub(max){ let a=1+Math.floor(Math.random()*max), b=1+Math.floor(Math.random()*max); if(b>a)[a,b]=[b,a]; return { prompt:`${a} - ${b} = ?`, answer:(a-b) }; }
    function mkSkip(){ const step=[2,5,10][Math.floor(Math.random()*3)]; const start=step*(1+Math.floor(Math.random()*5)); return { prompt:`${start}, ${start+step}, ${start+step*2}, ?`, answer:(start+step*3) }; }
    // Missing-addend (CCSS 1.OA.4/1.OA.8): "8 + ? = 11" or "? + 3 = 11" — solving for an
    // unknown term rather than computing a sum, a distinct 1st-grade skill from plain add/sub.
    function mkMissingAddend(max){
      const a=1+Math.floor(Math.random()*max), b=1+Math.floor(Math.random()*max), c=a+b;
      return Math.random()<0.5
        ? { prompt:`${a} + ? = ${c}`, answer:b }
        : { prompt:`? + ${b} = ${c}`, answer:a };
    }
    // Weighted random pick between a level's mix of question forms.
    function pick(weighted){
      const total = weighted.reduce((s,[,w])=>s+w, 0);
      let r = Math.random()*total;
      for(const [fn,w] of weighted){ r -= w; if(r < 0) return fn(); }
      return weighted[weighted.length-1][0]();
    }
    if(level === 1) return mkAdd(10);
    if(level === 2) return pick([[()=>mkSub(10),7],[()=>mkMissingAddend(10),3]]);
    if(level === 3) return pick([[()=>mkAdd(20),4],[()=>mkSub(20),3],[()=>mkMissingAddend(20),3]]); // within-20 tier (CCSS 1.OA.C.6)
    if(level === 4) return pick([[()=>mkAdd(50),6],[()=>mkMissingAddend(50),4]]);
    if(level === 5) return pick([[()=>mkSub(50),4],[()=>mkSkip(),3],[()=>mkMissingAddend(50),3]]);
    return pick([[()=>mkAdd(100),4],[()=>mkSub(100),3],[()=>mkMissingAddend(100),3]]);
  }
  function buildMathItems(level, qCount){
    const optCount = optionCountFor(level, 6); // arithmetic distractors are unlimited, no pool cap
    const seen = new Set();
    const items = [];
    let guard = 0;
    while(items.length < qCount && guard < qCount*20){
      guard++;
      const q = genMathOne(level);
      if(seen.has(q.prompt)) continue;
      seen.add(q.prompt);
      const correct = q.answer;
      let wrongOpts = new Set();
      let tries = 0;
      while(wrongOpts.size < optCount-1 && tries < 40){
        tries++;
        let delta = (1+Math.floor(Math.random()*8)) * (Math.random()<0.5?-1:1);
        let w = correct + delta;
        if(w >= 0 && w !== correct) wrongOpts.add(w);
      }
      let opts = [correct, ...wrongOpts].sort(()=>Math.random()-0.5);
      items.push({ subject:"math", prompt:q.prompt, speak:null, options:opts.map(String), answer:String(correct) });
    }
    return items;
  }

  function buildTodaySet(){
    const en = buildEnglishItems(state.level.en, 5);
    const math = buildMathItems(state.level.math, 5);
    const mixed = [];
    for(let i=0;i<5;i++){ mixed.push(en[i]); mixed.push(math[i]); }
    return mixed;
  }

  /* ================= TTS ================= */
  function speakUtterance(text, lang){
    return new Promise(resolve=>{
      if(!text || !("speechSynthesis" in window)){ resolve(false); return; }
      try{
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang || "en-US";
        u.rate = 0.85;
        let settled = false;
        u.onstart = ()=>{ if(!settled){ settled=true; resolve(true); } };
        u.onerror = ()=>{ if(!settled){ settled=true; resolve(false); } };
        window.speechSynthesis.speak(u);
        setTimeout(()=>{ if(!settled){ settled=true; resolve(false); } }, 800);
      }catch(e){ resolve(false); }
    });
  }
  function speak(text, lang){ speakUtterance(text, lang); }

    if(ok) greetingPlayed = true;

  /* ================= Sound effects (Web Audio, no external assets) ================= */
  let audioCtx = null;
  function getCtx(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function beep(freq, duration, type, vol){
    const ctx = getCtx();
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    gain.gain.value = vol==null?0.12:vol;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.stop(ctx.currentTime + duration);
  }
  function sfxClick(){ beep(500, 0.06, "square", 0.06); }
  function sfxCorrect(){ beep(880,0.12,"sine",0.13); setTimeout(()=>beep(1175,0.15,"sine",0.13), 90); }

  let timerHandle = null;

  function currentElapsedSeconds(){
    const base = state.today.timeSpent || 0;
    const live = sessionStartTs ? Math.floor((Date.now()-sessionStartTs)/1000) : 0;
    return base + live;

  function fmtTime(sec){ const m=Math.floor(sec/60), s=sec%60; return `${pad2(m)}:${pad2(s)}`; }
  function fmtClock(ms){
    if(!ms) return "--:--";
    const d = new Date(ms);
    return d.toLocaleTimeString(state.lang==="zh" ? "zh-CN" : "en-US",
      state.lang==="zh" ? {hour:"2-digit", minute:"2-digit", hour12:false} : {hour:"numeric", minute:"2-digit", hour12:true});

  /* ================= Stars ================= */
  function getStars(correct, total){
    if(correct >= total) return 3;
    if(correct >= Math.ceil(total*0.8)) return 2;
    if(correct >= Math.ceil(total*0.5)) return 1;
    return 0;
  }
  function starsHtml(n){ let s=""; for(let i=0;i<3;i++) s += i<n ? "⭐" : "☆"; return s; }

  /* ================= Cloud sync (via window.CampSync, see the module script above) ================= */
  const REACTION_EMOJIS = ["👍","🌟","🎉","❤️"];
  let syncStatus = "off"; // 'off' | 'connecting' | 'on' | 'error'

  function cloudPayloadFromLocal(){
    return { days: state.history, meta: { streak: state.streak, bestStreak: state.bestStreak, badges: state.badges } };
  }
  function mergeCloudIntoLocal(cloud){
    if(!cloud) return;
    // A resetSignal means another device explicitly deleted a day (see CampSync.deleteDay).
    // Apply it before merging cloud.days, and dedupe on ts so it only fires once — otherwise
    // every later snapshot (e.g. from the son's own progress pushes) would re-fire it and
    // keep wiping that day's freshly-redone practice.
    if(cloud.resetSignal && cloud.resetSignal.ts > (state.lastAppliedResetTs||0)){
      const key = cloud.resetSignal.key;
      if(state.history[key]) delete state.history[key];
      if(key === todayStr()){
        state.today = { date: todayStr(), items: buildTodaySet(), answers: [], timeSpent: 0 };
      }
      recomputeStreak();
      state.lastAppliedResetTs = cloud.resetSignal.ts;
    }
    if(cloud.days){
      Object.keys(cloud.days).forEach(k=>{
        const remote = cloud.days[k];
        if(!state.history[k]){
          state.history[k] = remote; // remote has a day we don't have locally: adopt it
        } else if(remote && remote.reaction && !state.history[k].reaction){
          state.history[k].reaction = remote.reaction; // a reaction can arrive from the other device
        }
      });
    }
    if(cloud.meta){
      if((cloud.meta.bestStreak||0) > state.bestStreak) state.bestStreak = cloud.meta.bestStreak;
    }
    saveState(state);
  }
  function pushToCloud(){
    if(isTestMode()) return; // test mode is local-only, never touches Firestore
    if(!state.pairCode || !window.CampSync) return;
    window.CampSync.push(state.pairCode, cloudPayloadFromLocal());
  }
  function setSyncStatus(s){
    syncStatus = s;
    const row = document.getElementById("syncStatusRow");
    if(row) row.textContent = t("syncStatus")(syncStatus);
  }
  function connectSync(pairCode){
    if(isTestMode()){ setSyncStatus("off"); return; } // test mode stays fully offline
    if(!window.CampSync){ return; }
    if(!pairCode){ setSyncStatus("off"); return; }
    setSyncStatus("connecting");
    window.CampSync.subscribe(pairCode, (cloud)=>{
      setSyncStatus("on");
      mergeCloudIntoLocal(cloud);
      checkForNewReaction();
      if(view === "home") renderHome();
      if(view === "review") renderReview(reviewKey);
    });
  }
  function checkForNewReaction(){
    // Show a banner for the most recent completed day if it has a reaction we haven't shown yet.
    const dates = Object.keys(state.history).sort().reverse();
    for(const k of dates.slice(0,3)){
      const rec = state.history[k];
      if(rec && rec.reaction && !state.seenReactionKeys.includes(k+":"+rec.reaction.emoji)){
        pendingReactionBanner = { date:k, emoji:rec.reaction.emoji };
        return;
      }
    }
    pendingReactionBanner = null;
  }
  let pendingReactionBanner = null;

  /* ================= DOM refs ================= */
  const homeCard = document.getElementById("homeCard");
  const overlayCard = document.getElementById("overlayCard");
  const pageOverlay = document.getElementById("pageOverlay");
  const backBtn = document.getElementById("backBtn");
  const overlayBackpack = document.getElementById("overlayBackpack");
  const lootRow = document.getElementById("lootRow");
  const backpackLabel = document.getElementById("backpackLabel");
  const appTitleEl = document.getElementById("appTitle");
  const langToggle = document.getElementById("langToggle");
  const footerNote = document.getElementById("footerNote");
  const calGrid = document.getElementById("calGrid");
  const calWeekdays = document.getElementById("calWeekdays");
  const calMonthLabel = document.getElementById("calMonthLabel");
  const calPrev = document.getElementById("calPrev");
  const calNext = document.getElementById("calNext");
  const settingsBtn = document.getElementById("settingsBtn");
  const settingsModal = document.getElementById("settingsModal");
  const closeSettings = document.getElementById("closeSettings");
  const settingsTitle = document.getElementById("settingsTitle");
  const langRowLabel = document.getElementById("langRowLabel");
  const nameRowLabel = document.getElementById("nameRowLabel");
  const nameInput = document.getElementById("nameInput");
  const syncRowLabel = document.getElementById("syncRowLabel");
  const syncInput = document.getElementById("syncInput");
  const syncConfirmBox = document.getElementById("syncConfirmBox");
  const syncConfirmWarning = document.getElementById("syncConfirmWarning");
  const syncConfirmBtn = document.getElementById("syncConfirmBtn");
  const syncCancelBtn = document.getElementById("syncCancelBtn");
  const versionRow = document.getElementById("versionRow");
  const moreRow = document.getElementById("moreRow");
  const testBanner = document.getElementById("testBanner");
  const testModeLabel = document.getElementById("testModeLabel");
  const testModeHint = document.getElementById("testModeHint");
  const testModeToggle = document.getElementById("testModeToggle");
  const resetTodayLabel = document.getElementById("resetTodayLabel");
  const resetTodayBtn = document.getElementById("resetTodayBtn");
  if(!isDevDevice){
    // Not dad's iPhone — the son's iPad should look like a clean, untouchable kid-mode app.
    document.getElementById("testModeRow").style.display = "none";
    document.getElementById("testModeHint").style.display = "none";
    document.getElementById("resetTodayRow").style.display = "none";
  }

  const LOOT_ICONS = ["💎","💎","🥇","💎","🥇","💎","💎","🥇","💎","🏆"];

  let view = "home";
  let reviewKey = null;

  const now0 = new Date();
  let calYear = now0.getFullYear();
  let calMonth = now0.getMonth();

  function goHome(){ stopTimer(); view = "home"; render(); }
  function showQuiz(){ view = "quiz"; startTimer(); render(); }

  backBtn.addEventListener("click", goHome);
  settingsBtn.addEventListener("click", ()=>{
    nameInput.value = state.userName;
    syncInput.value = state.pairCode;
    testModeToggle.checked = isTestMode();
    hideSyncConfirm();
    settingsModal.classList.add("show");
  });
  testModeToggle.addEventListener("change", ()=>{
    const turningOn = testModeToggle.checked;
    if(!confirm(turningOn ? t("testModeOnConfirm") : t("testModeOffConfirm"))){
      testModeToggle.checked = !turningOn;
      return;
    }
    localStorage.setItem(TEST_MODE_KEY, turningOn ? "1" : "0");
    location.reload();
  });
  resetTodayBtn.addEventListener("click", ()=>{
    if(confirm(t("resetTodayConfirm"))){
      resetTodayProgress();
      settingsModal.classList.remove("show");
    }
  });
  closeSettings.addEventListener("click", ()=>{ hideSyncConfirm(); settingsModal.classList.remove("show"); });
  settingsModal.addEventListener("click", (e)=>{ if(e.target===settingsModal){ hideSyncConfirm(); settingsModal.classList.remove("show"); } });
  nameInput.addEventListener("input", ()=>{
    state.userName = nameInput.value.slice(0,20);
    saveState(state);
  });
  syncInput.addEventListener("change", ()=>{
    const newCode = syncInput.value.trim().toLowerCase().slice(0,12);
    // Never apply a pairing-code change immediately: show a warning + 5-second countdown
    // first, since this disconnects the device from whatever it was synced to. The input
    // itself reverts to the current code until the change is actually confirmed, so it never
    // looks like the switch already happened.
    syncInput.value = state.pairCode;
    if(newCode === state.pairCode) return;
    openSyncConfirm(newCode);
  });

  let syncConfirmTimer = null;
  let syncConfirmSeconds = 0;
  let pendingSyncCode = null;

  function openSyncConfirm(newCode){
    pendingSyncCode = newCode;
    syncConfirmWarning.textContent = newCode ? t("syncConfirmWarningChange")(newCode) : t("syncConfirmWarningClear");
    syncConfirmSeconds = 5;
    syncConfirmBtn.disabled = true;
    syncConfirmBtn.textContent = t("syncConfirmBtn")(syncConfirmSeconds);
    syncCancelBtn.textContent = t("syncCancelBtn");
    syncConfirmBox.style.display = "block";
    if(syncConfirmTimer) clearInterval(syncConfirmTimer);
    syncConfirmTimer = setInterval(()=>{
      syncConfirmSeconds--;
      if(syncConfirmSeconds <= 0){
        clearInterval(syncConfirmTimer);
        syncConfirmTimer = null;
        syncConfirmBtn.disabled = false;
        syncConfirmBtn.textContent = t("syncConfirmBtn")(0);
      } else {
        syncConfirmBtn.textContent = t("syncConfirmBtn")(syncConfirmSeconds);
      }
    }, 1000);
  }
  function hideSyncConfirm(){
    if(syncConfirmTimer){ clearInterval(syncConfirmTimer); syncConfirmTimer = null; }
    syncConfirmBox.style.display = "none";
    pendingSyncCode = null;
  }
  syncCancelBtn.addEventListener("click", ()=>{
    syncInput.value = state.pairCode;
    hideSyncConfirm();
  });
  syncConfirmBtn.addEventListener("click", ()=>{
    if(syncConfirmBtn.disabled) return; // countdown not finished yet
    const code = pendingSyncCode;
    hideSyncConfirm();
    state.pairCode = code;
    saveState(state);
    syncInput.value = code;
    if(isTestMode()){ setSyncStatus("off"); return; } // test mode never calls out to Firestore
    if(code){
      window.CampSync && window.CampSync.pull(code).then(cloud=>{
        mergeCloudIntoLocal(cloud);
        pushToCloud();
        connectSync(code);
        render();
      });
    } else {
      setSyncStatus("off");
    }
  });

  langToggle.addEventListener("click", ()=>{
    state.lang = state.lang === "en" ? "zh" : "en";
    saveState(state);
    render();
  });

  calPrev.addEventListener("click", ()=>{
    calMonth--; if(calMonth<0){ calMonth=11; calYear--; }
    renderCalendar();
  });
  calNext.addEventListener("click", ()=>{
    const isCurrent = calYear===now0.getFullYear() && calMonth===now0.getMonth();
    if(isCurrent) return;
    calMonth++; if(calMonth>11){ calMonth=0; calYear++; }
    renderCalendar();
  });

  function render(){
    appTitleEl.innerHTML = t("appTitle") + (t("appSub") ? "<br>"+t("appSub") : "");
    footerNote.textContent = t("footerNote")(VERSION);
    backBtn.textContent = t("back");
    settingsTitle.textContent = t("settingsTitle");
    testModeLabel.textContent = t("testModeLabel");
    testModeHint.textContent = t("testModeHint");
    resetTodayLabel.textContent = t("resetTodayLabel");
    testBanner.textContent = t("testBannerText");
    document.body.classList.toggle("test-mode", isTestMode());
    nameRowLabel.textContent = t("nameRowLabel");
    nameInput.placeholder = state.lang==="zh" ? "例如：乔治" : "e.g. Alex";
    langRowLabel.textContent = t("langRowLabel");
    langToggle.textContent = t("langBtn");
    syncRowLabel.textContent = t("syncRowLabel");
    document.getElementById("syncStatusRow").textContent = t("syncStatus")(syncStatus);
    versionRow.textContent = VERSION;
    moreRow.textContent = t("moreRow");

    const isOverlay = (view === "quiz" || view === "review" || view === "done");
    pageOverlay.classList.toggle("show", isOverlay);
    overlayBackpack.style.display = (view === "quiz") ? "flex" : "none";

    if(view === "home") renderHome();
    else if(view === "quiz") renderQuestion();
    else if(view === "review") renderReview(reviewKey);
    else if(view === "done") renderDone();

    renderCalendar();
    if(view === "quiz") renderBackpack();
  }

  function renderCalendar(){
    calMonthLabel.textContent = `${t("months")[calMonth]} ${calYear}`;
    calWeekdays.innerHTML = t("weekdays").map(d=>`<div>${d}</div>`).join("");
    const isCurrentMonth = calYear===now0.getFullYear() && calMonth===now0.getMonth();
    calNext.disabled = isCurrentMonth;

    calGrid.innerHTML = "";
    const firstWeekday = new Date(calYear, calMonth, 1).getDay();
    const numDays = new Date(calYear, calMonth+1, 0).getDate();

    for(let i=0;i<firstWeekday;i++){
      const blank = document.createElement("div");
      blank.className = "cal-cell blank";
      calGrid.appendChild(blank);
    }

    for(let d=1; d<=numDays; d++){
      const cellDate = new Date(calYear, calMonth, d);
      const key = keyOf(cellDate);
      const isToday = key === todayStr();
      const isFuture = cellDate > new Date(now0.getFullYear(),now0.getMonth(),now0.getDate());
      const record = state.history[key];
      const todayLiveDone = isToday && state.today.answers.length >= state.today.items.length;

      const cell = document.createElement("div");
      let cls = "cal-cell";
      let inner = `${d}`;

      if(isFuture){
        cls += " future";
      } else if(record && record.done){
        cls += " done";
        inner += `<span class="stardot">${"⭐".repeat(record.stars||0)}</span>`;
        if(record.reaction && record.reaction.emoji) inner += `<span class="reactiondot">${record.reaction.emoji}</span>`;
        cell.addEventListener("click", ()=>{ reviewKey = key; view = "review"; render(); });
      } else if(isToday){
        cls += " today";
        if(todayLiveDone){
          cell.addEventListener("click", ()=>{ reviewKey = key; view = "review"; render(); });
        } else {
          cell.addEventListener("click", showQuiz);
        }
      } else {
        cls += " missed";
      }
      cell.className = cls;
      cell.innerHTML = inner;
      calGrid.appendChild(cell);
    }
  }

  function renderBackpack(){
    lootRow.innerHTML = "";
    const correctCount = state.today.answers.filter(a=>a.correct).length;
    backpackLabel.textContent = `${state.lang==='zh'?'今日背包':'Backpack'} · ${correctCount}/10`;
    for(let i=0;i<10;i++){
      const div = document.createElement("div");
      div.className = "loot" + (i < correctCount ? "" : " empty");
      div.textContent = i < correctCount ? LOOT_ICONS[i] : "·";
      lootRow.appendChild(div);
    }
  }

  function renderHome(){
    const idx = state.today.answers.length;
    const total = state.today.items.length;
    const todayDone = idx >= total;
    let btnLabel, btnClass = "primary-btn", onClick;

    if(todayDone){
      btnLabel = t("doneBtnReview");
      btnClass += " review-mode";
      onClick = ()=>{ reviewKey = todayStr(); view = "review"; render(); };
    } else if(idx > 0){
      btnLabel = t("continueBtn")(idx, total);
      onClick = showQuiz;
    } else {
      btnLabel = t("startBtn");
      onClick = showQuiz;
    }

    const badgeRow = MILESTONES.map(m=>{
      const earned = state.badges.includes(m);
      return `<div class="badge-chip ${earned?'':'locked'}" title="${t('badgeLabel')(m)}">${BADGE_ICON[m]}</div>`;
    }).join("");

    const banner = pendingReactionBanner
      ? `<div class="badge-banner" id="reactionBanner">${t("reactionBanner")(pendingReactionBanner.date, pendingReactionBanner.emoji)}</div>`
      : "";

    homeCard.innerHTML = `
      <div class="home">
        ${banner}
        <div class="streak-big">${t("streak")(state.streak)}</div>
        <div class="best-streak">${t("bestStreak")(state.bestStreak)}</div>
        <div class="badge-row">${badgeRow}</div>
        <button class="${btnClass}" id="startBtn">${btnLabel}</button>
        <p class="hint">${t("hint")}</p>
        ${(idx > 0 && !todayDone) ? `<button class="giveup-link" id="giveUpBtn">${t("giveUp")}</button>` : ""}
      </div>
    `;
    document.getElementById("startBtn").addEventListener("click", onClick);
    const reactionBannerEl = document.getElementById("reactionBanner");
    if(reactionBannerEl && pendingReactionBanner){
      const seenKey = pendingReactionBanner.date + ":" + pendingReactionBanner.emoji;
      reactionBannerEl.addEventListener("click", ()=>{
        state.seenReactionKeys.push(seenKey);
        saveState(state);
        // Don't just clear the banner — if dad reacted to more than one backlogged day,
        // there may be another unseen reaction waiting. Re-check so it appears next,
        // instead of silently dropping every reaction except the single most recent one.
        checkForNewReaction();
        renderHome();
      });
    }
    const giveUpBtn = document.getElementById("giveUpBtn");
    if(giveUpBtn){
      giveUpBtn.addEventListener("click", ()=>{
        if(confirm(t("giveUpConfirm"))){
          state.today = { date: todayStr(), items: buildTodaySet(), answers: [], timeSpent: state.today.timeSpent||0 };
          saveState(state);
          render();
        }
      });
    }
  }

  function renderReview(key){
    const isTodayLive = key === todayStr() && !(state.history[key]);
    const record = isTodayLive
      ? { correct: state.today.answers.filter(a=>a.correct).length, items: state.today.answers, timeSpent: state.today.timeSpent,
          stars: getStars(state.today.answers.filter(a=>a.correct).length, state.today.items.length||10), completedAt: null }
      : state.history[key];
    if(!record){ goHome(); return; }
    const total = (record.items||[]).length || 10;
    const rows = (record.items||[]).map(a=>{
      const cls = a.correct ? "right" : "wrong";
      const mark = a.correct ? "✅" : "❌";
      return `
        <div class="review-item ${cls}">
          <span class="mark">${mark}</span>
          <div class="qp">
            <div>${a.prompt}</div>
            <div class="ans">${t("yourAnswer")}${a.chosen}${a.correct ? "" : t("correctLabel") + a.correctAnswer}</div>
          </div>
        </div>`;
    }).join("");
    // The reaction picker is dad-only: on the son's iPad this must not render as a clickable
    // control at all, or he could just tap a reaction for himself, defeating the point of dad
    // reviewing and approving. The son can still see a reaction that's already been given
    // (read-only), matching the permanent emoji badge on the calendar — he just can't set one.
    const reactionRow = isTodayLive ? "" : (
      isDevDevice
        ? `<div class="review-time">${t("reactionRowLabel")}</div>
           <div class="badge-row" id="reactionPicker" style="justify-content:flex-start; margin-bottom:14px;">
             ${REACTION_EMOJIS.map(e=>`<div class="badge-chip react-opt ${record.reaction && record.reaction.emoji===e ? '' : 'locked'}" data-emoji="${e}">${e}</div>`).join("")}
           </div>`
        : (record.reaction && record.reaction.emoji
            ? `<div class="review-time">${t("dadReactionLabel")} <span style="font-size:20px; vertical-align:middle;">${record.reaction.emoji}</span></div>`
            : "")
    );
    overlayCard.innerHTML = `
      <div class="review-summary">${key} · ${t("doneScore")(record.correct, total)}</div>
      <div class="stars-line">${starsHtml(record.stars||0)}</div>
      <div class="review-time">${t("timeSpent")(fmtTime(record.timeSpent||0))}</div>
      <div class="review-time">${t("completedAt")(fmtClock(record.completedAt))}</div>
      ${reactionRow}
      <div class="review-list">${rows || `<p>${t("noRecord")}</p>`}</div>
    `;
    const picker = document.getElementById("reactionPicker");
    if(picker){
      picker.querySelectorAll(".react-opt").forEach(el=>{
        el.addEventListener("click", ()=>{
          const emoji = el.getAttribute("data-emoji");
          state.history[key].reaction = { emoji, ts: Date.now() };
          saveState(state);
          pushToCloud();
          renderReview(key);
        });
      });
    }
  }

  function updateStreakOnComplete(){
    const key = todayStr();
    if(state.history[key] && state.history[key].done) return;
    stopTimer();
    const correctCount = state.today.answers.filter(a=>a.correct).length;
    const total = state.today.items.length;
    const nowMs = Date.now();
    state.history[key] = {
      done:true, correct: correctCount, items: state.today.answers.slice(),
      timeSpent: state.today.timeSpent||0, stars: getStars(correctCount, total),
      completedAt: nowMs
    };
    const y = new Date(); y.setDate(y.getDate()-1);
    const yKey = keyOf(y);
    if(state.history[yKey] && state.history[yKey].done){
      state.streak += 1;
    } else {
      state.streak = 1;
    }
    if(state.streak > state.bestStreak) state.bestStreak = state.streak;

    justEarnedBadges = MILESTONES.filter(m => state.streak >= m && !state.badges.includes(m));
    justEarnedBadges.forEach(m => state.badges.push(m));

    state.lastCompleteDate = key;
    saveState(state);
    pushToCloud();
  }

  // Recomputes streak from scratch by walking backward through history. Used after
  // resetTodayProgress() removes a (possibly accidental) completion, since the streak
  // counter itself isn't safe to just decrement — it may have already advanced bestStreak
  // or unlocked a badge off the bad data.
  function recomputeStreak(){
    let d = new Date();
    const key = todayStr();
    if(!(state.history[key] && state.history[key].done)) d.setDate(d.getDate()-1);
    let streak = 0;
    while(state.history[keyOf(d)] && state.history[keyOf(d)].done){
      streak++;
      d.setDate(d.getDate()-1);
    }
    state.streak = streak;
    if(state.streak > state.bestStreak) state.bestStreak = state.streak;
  }

  function resetTodayProgress(){
    const key = todayStr();
    delete state.history[key];
    state.today = { date: todayStr(), items: buildTodaySet(), answers: [], timeSpent: 0 };
    recomputeStreak();
    saveState(state);
    // Use deleteDay (not pushToCloud/setDoc merge) — merge can only add/overwrite fields,
    // it can never remove one, which was exactly why the old reset silently failed to stick:
    // the "completed" entry stayed in the cloud doc and synced right back down.
    if(!isTestMode() && state.pairCode && window.CampSync){
      window.CampSync.deleteDay(state.pairCode, key);
    }
    goHome();
  }

  function adjustLevel(subject, wasCorrect){
    const comboKey = subject+"Combo";
    const wrongKey = subject+"WrongCombo";
    state.today[comboKey] = state.today[comboKey] || 0;
    state.today[wrongKey] = state.today[wrongKey] || 0;
    if(wasCorrect){
      state.today[comboKey] += 1;
      state.today[wrongKey] = 0;
      if(state.today[comboKey] >= 4 && state.level[subject] < 6){
        state.level[subject] += 1;
        state.today[comboKey] = 0;
      }
    } else {
      state.today[comboKey] = 0;
      state.today[wrongKey] += 1;
      // Require 2 wrong in a row (not just 1) before dropping a level — with more
      // answer options now in play, a single miss is less diagnostic of true difficulty.
      if(state.today[wrongKey] >= 2 && state.level[subject] > 1){
        state.level[subject] -= 1;
        state.today[wrongKey] = 0;
      }
    }
  }

  function renderQuestion(){
    const idx = state.today.answers.length;
    const total = state.today.items.length;

    if(idx >= total){
      updateStreakOnComplete();
      view = "done";
      renderDone();
      return;
    }

    startTimer();
    const q = state.today.items[idx];
    const isListen = q.type === "listen";
    overlayCard.innerHTML = `
      <div class="progress-row">
        <span class="subject-tag ${q.subject==='math'?'math':''}">${q.subject==='math'?t("subjectMath"):t("subjectEn")}</span>
        <span>${idx+1} / ${total}</span>
        <span class="timer-badge" id="liveTimer">⏱ ${fmtTime(currentElapsedSeconds())}</span>
      </div>
      <div class="question-box">
        <div class="qtext ${q.big?'big':''}">${q.prompt}</div>
        ${(q.speak && !isListen) ? `<div class="speak-btn" id="speakBtn">🔊</div>` : ""}
        ${isListen ? `<div class="review-time">${t("listenInstructions")}</div>` : ""}
      </div>
      <div class="options" id="optionsRow"></div>
      ${isListen ? `<button class="opt-btn" id="listenConfirmBtn" disabled style="width:100%; margin-top:6px;">${t("confirmLabel")}</button>` : ""}
      <div class="feedback" id="feedback"></div>
    `;

    if(q.speak && !isListen){
      document.getElementById("speakBtn").addEventListener("click", ()=>speak(q.speak, "en-US"));
      // Sight-word questions (q.big) are fundamentally a sound-to-picture match, so we
      // read them aloud automatically. Letter/sentence questions stay manual-only — the
      // point there is independent reading, so auto-playing would just let him skip that.
      if(q.big) speak(q.speak, "en-US");
    }

    const optionsRow = document.getElementById("optionsRow");
    if(isListen){
      // Listening-discrimination: tapping an option only previews its audio (repeatable,
      // freely re-selectable) — it does NOT submit. A separate Confirm button locks in
      // whichever option is currently selected, and that's final (no changing after).
      let selected = null;
      q.options.forEach((opt,i)=>{
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.textContent = "🔊 " + (i+1);
        btn.dataset.value = opt;
        btn.addEventListener("click", ()=>{
          sfxClick();
          speak(opt, "en-US");
          Array.from(optionsRow.children).forEach(b=>b.classList.remove("selected"));
          btn.classList.add("selected");
          selected = opt;
          confirmBtn.disabled = false;
        });
        optionsRow.appendChild(btn);
      });
      const confirmBtn = document.getElementById("listenConfirmBtn");
      confirmBtn.addEventListener("click", ()=>{
        if(selected === null) return;
        confirmBtn.disabled = true;
        const chosenBtn = Array.from(optionsRow.children).find(b=>b.dataset.value===selected);
        handleAnswer(q, selected, chosenBtn, optionsRow);
      });
    } else {
      q.options.forEach(opt=>{
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.textContent = opt;
        btn.dataset.value = opt;
        btn.addEventListener("click", ()=>handleAnswer(q, opt, btn, optionsRow));
        optionsRow.appendChild(btn);
      });
    }
  }

  function handleAnswer(q, chosen, btnEl, rowEl){
    sfxClick();
    const correct = (String(chosen) === String(q.answer));
    Array.from(rowEl.children).forEach(b=>b.disabled = true);
    const confirmBtn = document.getElementById("listenConfirmBtn");
    if(confirmBtn) confirmBtn.disabled = true;
    if(btnEl) btnEl.classList.add(correct?"correct":"wrong");
    if(!correct){
      Array.from(rowEl.children).forEach(b=>{
        if(String(b.dataset.value)===String(q.answer)) b.classList.add("correct");
      });
    }
    if(correct) sfxCorrect(); else sfxWrong();

    const fb = document.getElementById("feedback");
    fb.textContent = correct ? t("correctFb") : t("wrongFb");
    fb.className = "feedback " + (correct?"good":"bad");

    state.today.answers.push({
      subject:q.subject, correct,
      prompt:q.prompt, chosen: String(chosen), correctAnswer: String(q.answer)
    });
    adjustLevel(q.subject, correct);
    saveState(state);
    renderBackpack();

    setTimeout(()=>{ renderQuestion(); }, 950);
  }

  function renderDone(){
    const correctCount = state.today.answers.filter(a=>a.correct).length;
    const total = state.today.items.length;
    const stars = getStars(correctCount, total);
    const key = todayStr();
    const completedAt = state.history[key] ? state.history[key].completedAt : Date.now();

    const badgeBanner = justEarnedBadges.length
      ? justEarnedBadges.map(m=>`<div class="badge-banner">${t("newBadge")(BADGE_ICON[m]+" "+t("badgeLabel")(m))}</div>`).join("")
      : "";

    overlayCard.innerHTML = `
      <div class="done">
        <div class="big">⛺</div>
        <h2>${t("doneTitle")}</h2>
        <div class="stars-line pop">${starsHtml(stars)}</div>
        <p>${t("doneScore")(correctCount, total)}<br>${t("timeSpent")(fmtTime(state.today.timeSpent||0))}<br>${t("completedAt")(fmtClock(completedAt))}</p>
        ${badgeBanner}
      </div>
    `;
    justEarnedBadges = [];
    spawnConfetti();
    sfxCelebrate();
  }

  /* ================= Init ================= */
  checkForNewReaction();
  render();
  function bootSyncIfConfigured(){ if(state.pairCode) connectSync(state.pairCode); }
  if(window.CampSync) bootSyncIfConfigured();
  else window.addEventListener("campsync-ready", bootSyncIfConfigured, { once:true });
  tryGreeting();
  document.addEventListener("click", gestureFallback);
  document.addEventListener("touchend", gestureFallback);
  window.__resetCamp = function(){ localStorage.removeItem(STORE_KEY); location.reload(); };
  window.__resetTestData = function(){ localStorage.removeItem("campState_v1_TEST"); location.reload(); };

  // iOS suspends JS execution (and drops network sockets) when a standalone PWA is
  // backgrounded, screen-locked, or just left idle — the existing Firestore onSnapshot
  // listener can be left stale, so a dad's reaction/reset pushed while the son's iPad was
  // asleep might not show up until he force-quits and reopens. Re-subscribing on every
  // return to foreground forces an immediate fresh fetch instead of waiting on that.
  let foregroundRefreshTimer = null;
  function refreshOnForeground(){
    if(document.visibilityState && document.visibilityState !== "visible") return;
    if(foregroundRefreshTimer) return; // debounce: visibilitychange/pageshow/focus can all fire together
    foregroundRefreshTimer = setTimeout(()=>{ foregroundRefreshTimer = null; }, 400);
    if(view !== "quiz") checkDayRollover(); // don't yank today's set out from under an in-progress quiz
    if(!isTestMode() && state.pairCode && window.CampSync){
      connectSync(state.pairCode); // drops any stale listener, subscribes fresh
    }
    render();
  }
  document.addEventListener("visibilitychange", refreshOnForeground);
  window.addEventListener("pageshow", refreshOnForeground);
  window.addEventListener("focus", refreshOnForeground);
})();
</script>
