<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Daily Camp · 每日营地</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Camp">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%235B8C3A'/%3E%3Crect x='20' y='55' width='60' height='30' fill='%238B5A2B'/%3E%3Crect x='40' y='15' width='20' height='40' fill='%23F2C14E'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --grass:#5B8C3A; --grass-dark:#3F6528; --dirt:#8B5A2B; --dirt-dark:#6B4420;
    --stone:#7D7D7D; --sky:#7EC8E3; --diamond:#4FD8E8; --gold:#F2C14E;
    --night:#1C2541; --ink:#22201B; --paper:#FAF7F0; --danger:#D9534F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--sky);
    background-image:linear-gradient(180deg, var(--sky) 0%, var(--sky) 60%, var(--grass) 60%, var(--grass) 100%);
    font-family:'Baloo 2', system-ui, sans-serif; color:var(--ink);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:calc(env(safe-area-inset-top) + 6px) 12px 32px; overflow-x:hidden; position:relative;
  }
  .pixel{font-family:'Press Start 2P', monospace;}

  /* ---------- Header row: title centered, gear at right, no lopsided whitespace ---------- */
  .header-row{
    width:100%; max-width:480px; display:grid;
    grid-template-columns:32px 1fr 32px; align-items:center;
    margin-bottom:14px;
  }
  .gear-btn{
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    font-size:16px; background:var(--paper); border:2px solid var(--ink);
    box-shadow:2px 2px 0 rgba(0,0,0,.3); cursor:pointer;
  }
  header{ text-align:center; }
  header h1{ font-size:15px; line-height:1.6; margin:0; color:var(--paper); text-shadow:2px 2px 0 var(--night); }

  .back-btn{
    display:block; width:100%; max-width:480px; text-align:left;
    font-size:13px; font-weight:800; color:var(--stone);
    background:none; border:none; cursor:pointer;
    margin-bottom:10px; padding:4px 0;
  }

  #homePage{ width:100%; display:flex; flex-direction:column; align-items:center; }

  .cal-wrap{
    width:100%; max-width:480px; background:rgba(255,255,255,.5);
    border:3px solid var(--ink); padding:10px; margin-bottom:14px;
  }
  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .cal-nav button{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:16px;
    background:var(--paper); border:2px solid var(--ink); width:30px; height:30px; cursor:pointer;
  }
  .cal-nav button:disabled{opacity:.3; cursor:default;}
  .cal-month-label{font-weight:800; font-size:13px;}
  .cal-weekdays, .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-weekdays div{ text-align:center; font-size:10px; font-weight:800; color:var(--stone); }
  .cal-cell{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    position:relative; font-size:11px; font-weight:700; border:2px solid transparent;
  }
  .cal-cell.blank{visibility:hidden;}
  .cal-cell.future{color:rgba(0,0,0,.25);}
  .cal-cell.missed{background:rgba(0,0,0,.08); border-color:rgba(0,0,0,.15);}
  .cal-cell.done{background:var(--gold); border-color:var(--dirt-dark); cursor:pointer; color:var(--ink);}
  .cal-cell.today{outline:2px dashed var(--night); outline-offset:1px; cursor:pointer; background:var(--diamond);}
  .cal-cell .stardot{position:absolute; bottom:1px; font-size:6px;}

  .home-columns{ width:100%; max-width:480px; display:flex; flex-direction:column; }
  .home-columns > .cal-wrap, .home-columns > .card{ margin-bottom:14px; }

  .card{
    width:100%; max-width:480px; background:var(--paper); border:4px solid var(--ink);
    box-shadow:6px 6px 0 rgba(0,0,0,.3); padding:18px; margin-bottom:14px;
  }
  .progress-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-weight:700; font-size:13px; color:var(--stone); }
  .timer-badge{ font-weight:800; font-size:12px; color:var(--night); background:var(--sky); border:2px solid var(--ink); padding:2px 8px; }
  .subject-tag{ display:inline-block; padding:3px 10px; font-size:11px; font-weight:800; border:2px solid var(--ink); background:var(--sky); }
  .subject-tag.math{background:var(--gold);}

  .question-box{ text-align:center; margin:18px 0; }
  .qtext{ font-size:26px; font-weight:800; line-height:1.4; word-break:break-word; }
  .speak-btn{
    display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; margin-top:8px;
    background:var(--diamond); border:3px solid var(--ink); font-size:18px; cursor:pointer;
  }
  .speak-btn:active{transform:translate(2px,2px);}

  .options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
  .opt-btn{
    padding:16px 8px; font-size:20px; font-weight:700; font-family:'Baloo 2', sans-serif;
    background:var(--paper); border:3px solid var(--ink); box-shadow:3px 3px 0 rgba(0,0,0,.25);
    cursor:pointer; min-height:56px;
  }
  .opt-btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,.25);}
  .opt-btn.correct{background:var(--grass); color:var(--paper); border-color:var(--grass-dark);}
  .opt-btn.wrong{background:var(--danger); color:var(--paper);}
  .opt-btn:disabled{opacity:.55;}

  .feedback{ text-align:center; min-height:26px; font-weight:800; font-size:15px; margin-top:10px; }
  .feedback.good{color:var(--grass-dark);} .feedback.bad{color:var(--danger);}

  .backpack{
    width:100%; max-width:480px; background:var(--dirt); border:4px solid var(--ink);
    box-shadow:6px 6px 0 rgba(0,0,0,.3); padding:12px 14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .backpack .label{ color:var(--paper); font-weight:800; font-size:12px; margin-right:4px; flex-basis:100%; }
  .loot{ width:34px; height:34px; display:flex; align-items:center; justify-content:center; font-size:18px; background:var(--night); border:2px solid var(--ink); }
  .loot.empty{opacity:.25;}

  .home{ text-align:center; }
  .streak-big{ font-size:34px; font-weight:800; margin:6px 0 2px; }
  .best-streak{ font-size:12px; font-weight:700; color:var(--stone); margin-bottom:14px; }
  .badge-row{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-bottom:16px; }
  .badge-chip{
    font-size:18px; width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    background:var(--paper); border:2px solid var(--ink); box-shadow:2px 2px 0 rgba(0,0,0,.25);
  }
  .badge-chip.locked{ opacity:.25; filter:grayscale(1); }
  .primary-btn{
    width:100%; padding:18px 10px; font-family:'Baloo 2', sans-serif; font-size:19px; font-weight:800;
    background:var(--gold); border:3px solid var(--ink); box-shadow:4px 4px 0 rgba(0,0,0,.3); cursor:pointer;
  }
  .primary-btn:active{transform:translate(2px,2px); box-shadow:2px 2px 0 rgba(0,0,0,.3);}
  .primary-btn.review-mode{background:var(--diamond);}
  .home .hint{ margin-top:14px; font-size:12px; color:var(--stone); font-weight:700; line-height:1.6; }
  .giveup-link{
    display:inline-block; margin-top:14px; font-size:11px; color:var(--danger);
    text-decoration:underline; background:none; border:none; cursor:pointer; font-weight:700;
  }

  #pageOverlay{
    position:fixed; inset:0; z-index:100;
    background:var(--sky);
    background-image:linear-gradient(180deg, var(--sky) 0%, var(--sky) 55%, var(--grass) 55%, var(--grass) 100%);
    display:none; flex-direction:column; align-items:center; overflow-y:auto;
    padding:calc(env(safe-area-inset-top) + 6px) 12px 28px;
  }
  #pageOverlay.show{ display:flex; }

  .review-list{ display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .review-item{ display:flex; align-items:center; gap:10px; border:2px solid var(--ink); padding:8px 10px; font-size:13px; font-weight:700; }
  .review-item .mark{ font-size:16px; flex-shrink:0; }
  .review-item .qp{ flex:1; }
  .review-item .ans{ color:var(--stone); font-size:11px; }
  .review-item.wrong{ background:#FBEAE9; }
  .review-item.right{ background:#EEF6E8; }
  .review-summary{ font-size:13px; font-weight:800; margin-bottom:4px; }
  .review-time{ font-size:12px; color:var(--stone); font-weight:700; margin-bottom:2px; }
  .stars-line{ font-size:26px; letter-spacing:4px; margin:6px 0; }

  .done{ text-align:center; }
  .done .big{font-size:48px; margin:6px 0;}
  .done h2{font-size:18px; color:var(--grass-dark); margin:8px 0;}
  .done p{font-size:14px; color:var(--stone); font-weight:700;}
  .badge-banner{
    background:var(--gold); border:3px solid var(--ink); padding:10px; margin:10px 0;
    font-size:13px; font-weight:800; box-shadow:3px 3px 0 rgba(0,0,0,.25);
  }

  footer{ margin-top:auto; padding-top:20px; font-size:10px; color:rgba(0,0,0,.35); text-align:center; }

  /* ---------- Test mode banner ---------- */
  #testBanner{
    display:none; position:fixed; top:0; left:0; right:0; z-index:500;
    background:repeating-linear-gradient(45deg, var(--gold), var(--gold) 10px, var(--night) 10px, var(--night) 20px);
    color:var(--paper); text-align:center; font-weight:800; font-size:11px;
    padding:5px 6px calc(5px + env(safe-area-inset-top)) 6px; letter-spacing:.3px;
    text-shadow:1px 1px 0 rgba(0,0,0,.4);
  }
  body.test-mode #testBanner{ display:block; }
  body.test-mode{ padding-top:calc(env(safe-area-inset-top) + 30px) !important; }
  body.test-mode #pageOverlay{ padding-top:calc(env(safe-area-inset-top) + 30px); }

  /* ---------- Settings modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; z-index:300; background:rgba(0,0,0,.45);
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .modal-backdrop.show{ display:flex; }
  .modal-card{
    width:100%; max-width:340px; background:var(--paper); border:4px solid var(--ink);
    box-shadow:6px 6px 0 rgba(0,0,0,.35); padding:18px;
  }
  .modal-card h3{ margin:0 0 14px; font-size:15px; }
  .settings-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; border-bottom:2px solid rgba(0,0,0,.08); font-size:13px; font-weight:700;
  }
  .settings-row.muted{ color:var(--stone); font-weight:700; font-size:11px; border-bottom:none; }
  .settings-row button{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:13px;
    padding:6px 12px; background:var(--diamond); border:2px solid var(--ink); cursor:pointer;
  }
  .settings-row input{
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:13px;
    padding:6px 8px; border:2px solid var(--ink); background:var(--paper);
    width:130px; color:var(--ink);
  }
  .modal-close{
    width:100%; margin-top:14px; padding:10px; font-family:'Baloo 2', sans-serif; font-weight:800;
    background:var(--paper); border:2px solid var(--ink); cursor:pointer;
  }

  /* ---------- Confetti ---------- */
  #confettiLayer{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:250; }
  .confetti-piece{
    position:absolute; top:-12px; width:8px; height:8px;
    animation-name:confetti-fall; animation-timing-function:ease-in; animation-fill-mode:forwards;
  }
  @keyframes confetti-fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(115vh) rotate(360deg); opacity:.85; }
  }
  @keyframes pop-in{
    0%{ transform:scale(.4); opacity:0; }
    70%{ transform:scale(1.08); opacity:1; }
    100%{ transform:scale(1); }
  }
  .done .big{ animation:pop-in .5s ease-out; }
  .stars-line.pop{ animation:pop-in .5s ease-out .15s both; }

  /* ================= iPad / landscape / wide-screen layout ================= */
  @media (min-width:780px){
    .header-row, .home-columns{ max-width:920px; }
    .home-columns{ flex-direction:row; align-items:flex-start; gap:24px; }
    .home-columns > .cal-wrap, .home-columns > .card{ max-width:none; flex:1; margin-bottom:0; }

    .solo-card{ max-width:700px; }
    .backpack{ max-width:700px; }

    .qtext{ font-size:34px; }
    .qtext.big{ font-size:56px; }
    .options{ gap:16px; }
    .opt-btn{ font-size:24px; padding:22px 10px; min-height:72px; }
    .primary-btn{ font-size:22px; padding:22px 10px; }
    .streak-big{ font-size:44px; }
    .badge-chip{ width:42px; height:42px; font-size:22px; }
    .loot{ width:42px; height:42px; font-size:22px; }
    .cal-cell{ font-size:14px; }
  }
</style>
</head>
<body>

<div id="testBanner"></div>
<div id="confettiLayer"></div>

<div id="homePage">
  <div class="header-row">
    <div></div>
    <header><h1 class="pixel" id="appTitle">Daily Camp</h1></header>
    <div class="gear-btn" id="settingsBtn">⚙️</div>
  </div>

  <div class="home-columns">
    <div class="cal-wrap">
      <div class="cal-nav">
        <button id="calPrev">‹</button>
        <span class="cal-month-label" id="calMonthLabel"></span>
        <button id="calNext">›</button>
      </div>
      <div class="cal-weekdays" id="calWeekdays"></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="card" id="homeCard"></div>
  </div>

  <footer id="footerNote">v2.0.0 · Saved on this device only · phone sync not set up yet</footer>
</div>

<div id="pageOverlay">
  <button class="back-btn" id="backBtn">← Home</button>
  <div class="card solo-card" id="overlayCard"></div>
  <div class="backpack" id="overlayBackpack" style="display:none;">
    <div class="label" id="backpackLabel">Backpack · 0/10</div>
    <div id="lootRow" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
  </div>
</div>

<div class="modal-backdrop" id="settingsModal">
  <div class="modal-card">
    <h3 id="settingsTitle">Settings</h3>
    <div class="settings-row">
      <span id="nameRowLabel">Name</span>
      <input type="text" id="nameInput" maxlength="20" placeholder="e.g. Alex">
    </div>
    <div class="settings-row">
      <span id="langRowLabel">Language</span>
      <button id="langToggle">中文</button>
    </div>
    <div class="settings-row">
      <span id="syncRowLabel">Sync code</span>
      <input type="text" id="syncInput" maxlength="12" placeholder="e.g. camp-482x" style="width:150px;">
    </div>
    <div class="settings-row muted" id="syncStatusRow"></div>
    <div class="settings-row" id="testModeRow">
      <span id="testModeLabel">Test Mode</span>
      <input type="checkbox" id="testModeToggle" style="width:22px;height:22px;">
    </div>
    <div class="settings-row muted" id="testModeHint"></div>
    <div class="settings-row" id="resetTodayRow">
      <span id="resetTodayLabel">Reset today's progress</span>
      <button id="resetTodayBtn">↺</button>
    </div>
    <div class="settings-row muted" id="versionRow"></div>
    <div class="settings-row muted" id="moreRow"></div>
    <button class="modal-close" id="closeSettings">Close</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDFnnLxYvmW-_E9h3T_jPDoZhi7aqOLkJQ",
    authDomain: "homework-471fb.firebaseapp.com",
    projectId: "homework-471fb",
    storageBucket: "homework-471fb.firebasestorage.app",
    messagingSenderId: "40029482214",
    appId: "1:40029482214:web:57de9642cd5102234bdf27"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let authReadyResolve;
  const authReady = new Promise(res => { authReadyResolve = res; });
  onAuthStateChanged(auth, user => { if(user) authReadyResolve(); });
  signInAnonymously(auth).catch(err => console.warn("Anonymous sign-in failed:", err));

  let unsubscribe = null;

  window.CampSync = {
    // Push this device's local days/meta up to the cloud doc for this pairing code.
    async push(pairCode, payload){
      if(!pairCode) return;
      await authReady;
      try{
        await setDoc(doc(db, "camps", pairCode), payload, { merge: true });
      }catch(e){ console.warn("CampSync.push failed:", e); }
    },
    // One-time fetch (used right after entering a pairing code, to pull existing history).
    async pull(pairCode){
      if(!pairCode) return null;
      await authReady;
      try{
        const snap = await getDoc(doc(db, "camps", pairCode));
        return snap.exists() ? snap.data() : null;
      }catch(e){ console.warn("CampSync.pull failed:", e); return null; }
    },
    // Live subscription: fires immediately with current data, then again on every change.
    subscribe(pairCode, cb){
      if(unsubscribe){ unsubscribe(); unsubscribe = null; }
      if(!pairCode) return;
      authReady.then(()=>{
        unsubscribe = onSnapshot(doc(db, "camps", pairCode), snap=>{
          cb(snap.exists() ? snap.data() : null);
        }, err => console.warn("CampSync.subscribe error:", err));
      });
    }
  };
  window.dispatchEvent(new Event("campsync-ready"));
</script>

  // Difficulty scales two ways as level rises: which content pool is used, AND how many
  // answer options are offered. Option count is capped per-type by how many honest
  // distractors actually exist for that type (see poolCapFor).
  function optionCountFor(level, cap){
    const target = level<=1 ? 4 : level===2 ? 5 : 6;
    return Math.min(target, cap);
  }
  function poolCapFor(level){
    if(level<=2) return 6; // sight-word: 44 other emoji available, easily supports 6
    if(level<=4) return 5; // missing-letter: only 5 vowels exist, honest cap is 5
    return 6;              // sentence-fill: shared grammar bank supports 6
  }
  function buildOptions(correct, wrongCandidates, count){
    const uniqueWrong = Array.from(new Set(wrongCandidates.filter(w=>w!==correct)));
    const chosen = uniqueWrong.sort(()=>Math.random()-0.5).slice(0, Math.max(0,count-1));
    return [correct, ...chosen].sort(()=>Math.random()-0.5);
  }

  function poolForLevel(level){
    if(level<=2) return { pool:SIGHT_WORDS, keyFn:w=>w[0], make:makeSightQuestion };
    if(level<=4) return { pool:MISSING_LETTER, keyFn:w=>w[3], make:makeLetterQuestion };
    return { pool:SENTENCE_FILL, keyFn:w=>w[0], make:makeSentenceQuestion };
  }
  function makeSightQuestion(row, optCount){
    const [word, emoji] = row;
    const wrongPool = SIGHT_WORDS.filter(w=>w[1]!==emoji).map(w=>w[1]);
    const opts = buildOptions(emoji, wrongPool, optCount);
    return { subject:"en", prompt: word, speak: word, options: opts, answer: emoji, big:true };
  }
  function makeLetterQuestion(row, optCount){
    const [word, right, wrong, full] = row;
    const vowels = ["a","e","i","o","u"];
    const wrongPool = Array.from(new Set([wrong, ...vowels.filter(v=>v!==right)]));
    const opts = buildOptions(right, wrongPool, optCount);
    return { subject:"en", prompt: word, speak: full, options: opts, answer: right };
  }
  function makeSentenceQuestion(row, optCount){
    const [sentence, right, wrong] = row;
    const wrongPool = Array.from(new Set([wrong, ...GRAMMAR_BANK.filter(w=>w!==right)]));

    return { subject:"en", prompt: sentence, speak: sentence.replace("___", right), options: opts, answer: right };
  }

  function buildEnglishItems(level, qCount){
    const { pool, keyFn, make } = poolForLevel(level);
    const recent = recentEnKeys();
    let avail = pool.filter(row=>!recent.has(keyFn(row)));
    if(avail.length < qCount) avail = pool.slice(); // pool exhausted for this window: allow repeats
    const chosen = avail.sort(()=>Math.random()-0.5).slice(0, qCount);
    logEnUsed(chosen.map(keyFn));
    const optCount = optionCountFor(level, poolCapFor(level));
    return chosen.map(row=>make(row, optCount));
  }

  function genMathOne(level){
    function mkAdd(max){ const a=1+Math.floor(Math.random()*max), b=1+Math.floor(Math.random()*max); return { prompt:`${a} + ${b} = ?`, answer:(a+b) }; }
    function mkSub(max){ let a=1+Math.floor(Math.random()*max), b=1+Math.floor(Math.random()*max); if(b>a)[a,b]=[b,a]; return { prompt:`${a} - ${b} = ?`, answer:(a-b) }; }
    function mkSkip(){ const step=[2,5,10][Math.floor(Math.random()*3)]; const start=step*(1+Math.floor(Math.random()*5)); return { prompt:`${start}, ${start+step}, ${start+step*2}, ?`, answer:(start+step*3) }; }
    let q;
    if(level === 1) q = mkAdd(10);
    else if(level === 2) q = mkSub(10);
    else if(level === 3) q = mkAdd(50);
    else if(level === 4) q = Math.random()<0.5 ? mkSub(50) : mkSkip();
    else q = Math.random()<0.5 ? mkAdd(100) : mkSub(100);
    return q;
  }
  function buildMathItems(level, qCount){
    const optCount = optionCountFor(level, 6); // arithmetic distractors are unlimited, no pool cap

    while(items.length < qCount && guard < qCount*20){
      guard++;
      const q = genMathOne(level);
      if(seen.has(q.prompt)) continue;
      seen.add(q.prompt);
      const correct = q.answer;
      let wrongOpts = new Set();
      let tries = 0;
      while(wrongOpts.size < optCount-1 && tries < 40){
        tries++;
        let delta = (1+Math.floor(Math.random()*8)) * (Math.random()<0.5?-1:1);
        let w = correct + delta;
        if(w >= 0 && w !== correct) wrongOpts.add(w);
      }
      let opts = [correct, ...wrongOpts].sort(()=>Math.random()-0.5);
      items.push({ subject:"math", prompt:q.prompt, speak:null, options:opts.map(String), answer:String(correct) });
    }
    return items;
  }

    osc.frequency.value = freq;

    osc.stop(ctx.currentTime + duration);
  }

  const now0 = new Date();
  let calYear = now0.getFullYear();
  let calMonth = now0.getMonth();

  function goHome(){ stopTimer(); view = "home"; render(); }
  function showQuiz(){ view = "quiz"; startTimer(); render(); }

  backBtn.addEventListener("click", goHome);
  settingsBtn.addEventListener("click", ()=>{
    nameInput.value = state.userName;
    syncInput.value = state.pairCode;
    testModeToggle.checked = isTestMode();
    settingsModal.classList.add("show");
  });
  testModeToggle.addEventListener("change", ()=>{
    const turningOn = testModeToggle.checked;
    if(!confirm(turningOn ? t("testModeOnConfirm") : t("testModeOffConfirm"))){
      testModeToggle.checked = !turningOn;
      return;
    }
    localStorage.setItem(TEST_MODE_KEY, turningOn ? "1" : "0");
    location.reload();
  });
  resetTodayBtn.addEventListener("click", ()=>{
    if(confirm(t("resetTodayConfirm"))){
      resetTodayProgress();
      settingsModal.classList.remove("show");
    }
  });
  closeSettings.addEventListener("click", ()=> settingsModal.classList.remove("show"));
  settingsModal.addEventListener("click", (e)=>{ if(e.target===settingsModal) settingsModal.classList.remove("show"); });
  nameInput.addEventListener("input", ()=>{
    state.userName = nameInput.value.slice(0,20);
    saveState(state);
  });
  syncInput.addEventListener("change", ()=>{
    const code = syncInput.value.trim().toLowerCase().slice(0,12);
    state.pairCode = code;
    saveState(state);
    if(isTestMode()){ setSyncStatus("off"); return; } // test mode never calls out to Firestore
    if(code){
      window.CampSync && window.CampSync.pull(code).then(cloud=>{
        mergeCloudIntoLocal(cloud);
        pushToCloud();
        connectSync(code);
        render();
      });
    } else {
      setSyncStatus("off");
    }
  });

  langToggle.addEventListener("click", ()=>{
    state.lang = state.lang === "en" ? "zh" : "en";
    saveState(state);
    render();
  });

  calPrev.addEventListener("click", ()=>{
    calMonth--; if(calMonth<0){ calMonth=11; calYear--; }
    renderCalendar();
  });
  calNext.addEventListener("click", ()=>{
    const isCurrent = calYear===now0.getFullYear() && calMonth===now0.getMonth();
    if(isCurrent) return;
    calMonth++; if(calMonth>11){ calMonth=0; calYear++; }
    renderCalendar();
  });

  function render(){
    appTitleEl.innerHTML = t("appTitle") + (t("appSub") ? "<br>"+t("appSub") : "");
    footerNote.textContent = t("footerNote")(VERSION);
    backBtn.textContent = t("back");
    settingsTitle.textContent = t("settingsTitle");
    testModeLabel.textContent = t("testModeLabel");
    testModeHint.textContent = t("testModeHint");
    resetTodayLabel.textContent = t("resetTodayLabel");
    testBanner.textContent = t("testBannerText");
    document.body.classList.toggle("test-mode", isTestMode());
    nameRowLabel.textContent = t("nameRowLabel");
    nameInput.placeholder = state.lang==="zh" ? "例如：乔治" : "e.g. Alex";
    langRowLabel.textContent = t("langRowLabel");
    langToggle.textContent = t("langBtn");
    syncRowLabel.textContent = t("syncRowLabel");
    document.getElementById("syncStatusRow").textContent = t("syncStatus")(syncStatus);
    versionRow.textContent = VERSION;
    moreRow.textContent = t("moreRow");

    const isOverlay = (view === "quiz" || view === "review" || view === "done");
    pageOverlay.classList.toggle("show", isOverlay);
    overlayBackpack.style.display = (view === "quiz") ? "flex" : "none";

    if(view === "home") renderHome();
    else if(view === "quiz") renderQuestion();
    else if(view === "review") renderReview(reviewKey);
    else if(view === "done") renderDone();

    renderCalendar();
    if(view === "quiz") renderBackpack();
  }

  function renderCalendar(){
    calMonthLabel.textContent = `${t("months")[calMonth]} ${calYear}`;
    calWeekdays.innerHTML = t("weekdays").map(d=>`<div>${d}</div>`).join("");
    const isCurrentMonth = calYear===now0.getFullYear() && calMonth===now0.getMonth();
    calNext.disabled = isCurrentMonth;

    calGrid.innerHTML = "";
    const firstWeekday = new Date(calYear, calMonth, 1).getDay();
    const numDays = new Date(calYear, calMonth+1, 0).getDate();

    for(let i=0;i<firstWeekday;i++){
      const blank = document.createElement("div");
      blank.className = "cal-cell blank";
      calGrid.appendChild(blank);
    }

    for(let d=1; d<=numDays; d++){
      const cellDate = new Date(calYear, calMonth, d);
      const key = keyOf(cellDate);
      const isToday = key === todayStr();
      const isFuture = cellDate > new Date(now0.getFullYear(),now0.getMonth(),now0.getDate());
      const record = state.history[key];
      const todayLiveDone = isToday && state.today.answers.length >= state.today.items.length;

      const cell = document.createElement("div");
      let cls = "cal-cell";
      let inner = `${d}`;

      if(isFuture){
        cls += " future";
      } else if(record && record.done){
        cls += " done";
        inner += `<span class="stardot">${"⭐".repeat(record.stars||0)}</span>`;
        cell.addEventListener("click", ()=>{ reviewKey = key; view = "review"; render(); });
      } else if(isToday){
        cls += " today";
        if(todayLiveDone){
          cell.addEventListener("click", ()=>{ reviewKey = key; view = "review"; render(); });
        } else {
          cell.addEventListener("click", showQuiz);
        }
      } else {
        cls += " missed";
      }
      cell.className = cls;
      cell.innerHTML = inner;
      calGrid.appendChild(cell);
    }
  }

  function renderBackpack(){
    lootRow.innerHTML = "";
    const correctCount = state.today.answers.filter(a=>a.correct).length;
    backpackLabel.textContent = `${state.lang==='zh'?'今日背包':'Backpack'} · ${correctCount}/10`;
    for(let i=0;i<10;i++){
      const div = document.createElement("div");
      div.className = "loot" + (i < correctCount ? "" : " empty");
      div.textContent = i < correctCount ? LOOT_ICONS[i] : "·";
      lootRow.appendChild(div);
    }
  }

  function renderHome(){
    const idx = state.today.answers.length;
    const total = state.today.items.length;
    const todayDone = idx >= total;
    let btnLabel, btnClass = "primary-btn", onClick;

    if(todayDone){
      btnLabel = t("doneBtnReview");
      btnClass += " review-mode";
      onClick = ()=>{ reviewKey = todayStr(); view = "review"; render(); };
    } else if(idx > 0){
      btnLabel = t("continueBtn")(idx, total);
      onClick = showQuiz;
    } else {
      btnLabel = t("startBtn");
      onClick = showQuiz;
    }

    const badgeRow = MILESTONES.map(m=>{
      const earned = state.badges.includes(m);
      return `<div class="badge-chip ${earned?'':'locked'}" title="${t('badgeLabel')(m)}">${BADGE_ICON[m]}</div>`;
    }).join("");

    const banner = pendingReactionBanner
      ? `<div class="badge-banner" id="reactionBanner">${t("reactionBanner")(pendingReactionBanner.date, pendingReactionBanner.emoji)}</div>`
      : "";

    homeCard.innerHTML = `
      <div class="home">
        ${banner}
        <div class="streak-big">${t("streak")(state.streak)}</div>
        <div class="best-streak">${t("bestStreak")(state.bestStreak)}</div>
        <div class="badge-row">${badgeRow}</div>
        <button class="${btnClass}" id="startBtn">${btnLabel}</button>
        <p class="hint">${t("hint")}</p>
        ${(idx > 0 && !todayDone) ? `<button class="giveup-link" id="giveUpBtn">${t("giveUp")}</button>` : ""}
      </div>
    `;
    document.getElementById("startBtn").addEventListener("click", onClick);
    const reactionBannerEl = document.getElementById("reactionBanner");
    if(reactionBannerEl && pendingReactionBanner){
      const seenKey = pendingReactionBanner.date + ":" + pendingReactionBanner.emoji;
      reactionBannerEl.addEventListener("click", ()=>{
        state.seenReactionKeys.push(seenKey);
        saveState(state);
        pendingReactionBanner = null;
        renderHome();
      });
    }
    const giveUpBtn = document.getElementById("giveUpBtn");
    if(giveUpBtn){
      giveUpBtn.addEventListener("click", ()=>{
        if(confirm(t("giveUpConfirm"))){
          state.today = { date: todayStr(), items: buildTodaySet(), answers: [], timeSpent: state.today.timeSpent||0 };
          saveState(state);
          render();
        }
      });
    }
  }

  function renderReview(key){
    const isTodayLive = key === todayStr() && !(state.history[key]);
    const record = isTodayLive
      ? { correct: state.today.answers.filter(a=>a.correct).length, items: state.today.answers, timeSpent: state.today.timeSpent,
          stars: getStars(state.today.answers.filter(a=>a.correct).length, state.today.items.length||10), completedAt: null }
      : state.history[key];
    if(!record){ goHome(); return; }
    const total = (record.items||[]).length || 10;
    const rows = (record.items||[]).map(a=>{
      const cls = a.correct ? "right" : "wrong";
      const mark = a.correct ? "✅" : "❌";
      return `
        <div class="review-item ${cls}">
          <span class="mark">${mark}</span>
          <div class="qp">
            <div>${a.prompt}</div>
            <div class="ans">${t("yourAnswer")}${a.chosen}${a.correct ? "" : t("correctLabel") + a.correctAnswer}</div>
          </div>
        </div>`;
    }).join("");
    const reactionRow = !isTodayLive ? `
      <div class="review-time">${t("reactionRowLabel")}</div>
      <div class="badge-row" id="reactionPicker" style="justify-content:flex-start; margin-bottom:14px;">
        ${REACTION_EMOJIS.map(e=>`<div class="badge-chip react-opt ${record.reaction && record.reaction.emoji===e ? '' : 'locked'}" data-emoji="${e}">${e}</div>`).join("")}
      </div>` : "";
    overlayCard.innerHTML = `
      <div class="review-summary">${key} · ${t("doneScore")(record.correct, total)}</div>
      <div class="stars-line">${starsHtml(record.stars||0)}</div>
      <div class="review-time">${t("timeSpent")(fmtTime(record.timeSpent||0))}</div>
      <div class="review-time">${t("completedAt")(fmtClock(record.completedAt))}</div>
      ${reactionRow}
      <div class="review-list">${rows || `<p>${t("noRecord")}</p>`}</div>
    `;
    const picker = document.getElementById("reactionPicker");
    if(picker){
      picker.querySelectorAll(".react-opt").forEach(el=>{
        el.addEventListener("click", ()=>{
          const emoji = el.getAttribute("data-emoji");
          state.history[key].reaction = { emoji, ts: Date.now() };
          saveState(state);
          pushToCloud();
          renderReview(key);
        });
      });
    }
  }

  function updateStreakOnComplete(){
    const key = todayStr();
    if(state.history[key] && state.history[key].done) return;
    stopTimer();
    const correctCount = state.today.answers.filter(a=>a.correct).length;
    const total = state.today.items.length;
    const nowMs = Date.now();
    state.history[key] = {
      done:true, correct: correctCount, items: state.today.answers.slice(),
      timeSpent: state.today.timeSpent||0, stars: getStars(correctCount, total),
      completedAt: nowMs
    };
    const y = new Date(); y.setDate(y.getDate()-1);
    const yKey = keyOf(y);
    if(state.history[yKey] && state.history[yKey].done){
      state.streak += 1;
    } else {
      state.streak = 1;
    }
    if(state.streak > state.bestStreak) state.bestStreak = state.streak;

    justEarnedBadges = MILESTONES.filter(m => state.streak >= m && !state.badges.includes(m));
    justEarnedBadges.forEach(m => state.badges.push(m));

    state.lastCompleteDate = key;
    saveState(state);
    pushToCloud();
  }

  // Recomputes streak from scratch by walking backward through history. Used after
  // resetTodayProgress() removes a (possibly accidental) completion, since the streak
  // counter itself isn't safe to just decrement — it may have already advanced bestStreak
  // or unlocked a badge off the bad data.
  function recomputeStreak(){
    let d = new Date();
    const key = todayStr();
    if(!(state.history[key] && state.history[key].done)) d.setDate(d.getDate()-1);
    let streak = 0;
    while(state.history[keyOf(d)] && state.history[keyOf(d)].done){
      streak++;
      d.setDate(d.getDate()-1);
    }
    state.streak = streak;
    if(state.streak > state.bestStreak) state.bestStreak = state.streak;
  }

  function resetTodayProgress(){
    const key = todayStr();
    delete state.history[key];
    state.today = { date: todayStr(), items: buildTodaySet(), answers: [], timeSpent: 0 };
    recomputeStreak();
    saveState(state);
    pushToCloud();
    goHome();
  }

  function adjustLevel(subject, wasCorrect){
    const comboKey = subject+"Combo";
    const wrongKey = subject+"WrongCombo";
    state.today[comboKey] = state.today[comboKey] || 0;
    state.today[wrongKey] = state.today[wrongKey] || 0;
    if(wasCorrect){
      state.today[comboKey] += 1;
      state.today[wrongKey] = 0;
      if(state.today[comboKey] >= 4 && state.level[subject] < 5){
        state.level[subject] += 1;
        state.today[comboKey] = 0;
      }
    } else {
      state.today[comboKey] = 0;
      state.today[wrongKey] += 1;
      // Require 2 wrong in a row (not just 1) before dropping a level — with more
      // answer options now in play, a single miss is less diagnostic of true difficulty.
      if(state.today[wrongKey] >= 2 && state.level[subject] > 1){
        state.level[subject] -= 1;
        state.today[wrongKey] = 0;
      }
    }
  }

  function renderQuestion(){
    const idx = state.today.answers.length;
    const total = state.today.items.length;

    if(idx >= total){
      updateStreakOnComplete();
      view = "done";
      renderDone();
      return;
    }

    startTimer();
    const q = state.today.items[idx];
    overlayCard.innerHTML = `
      <div class="progress-row">
        <span class="subject-tag ${q.subject==='math'?'math':''}">${q.subject==='math'?t("subjectMath"):t("subjectEn")}</span>
        <span>${idx+1} / ${total}</span>
        <span class="timer-badge" id="liveTimer">⏱ ${fmtTime(currentElapsedSeconds())}</span>
      </div>
      <div class="question-box">
        <div class="qtext ${q.big?'big':''}">${q.prompt}</div>
        ${q.speak ? `<div class="speak-btn" id="speakBtn">🔊</div>` : ""}
      </div>
      <div class="options" id="optionsRow"></div>
      <div class="feedback" id="feedback"></div>
    `;

    if(q.speak){
      document.getElementById("speakBtn").addEventListener("click", ()=>speak(q.speak, "en-US"));
      // Sight-word questions (q.big) are fundamentally a sound-to-picture match, so we
      // read them aloud automatically. Letter/sentence questions stay manual-only — the
      // point there is independent reading, so auto-playing would just let him skip that.
      if(q.big) speak(q.speak, "en-US");
    }

    const optionsRow = document.getElementById("optionsRow");
    q.options.forEach(opt=>{
      const btn = document.createElement("button");
      btn.className = "opt-btn";
      btn.textContent = opt;
      btn.addEventListener("click", ()=>handleAnswer(q, opt, btn, optionsRow));
      optionsRow.appendChild(btn);
    });
  }

  function handleAnswer(q, chosen, btnEl, rowEl){
    sfxClick();
    const correct = (String(chosen) === String(q.answer));
    Array.from(rowEl.children).forEach(b=>b.disabled = true);
    btnEl.classList.add(correct?"correct":"wrong");
    if(!correct){
      Array.from(rowEl.children).forEach(b=>{
        if(String(b.textContent)===String(q.answer)) b.classList.add("correct");
      });
    }
    if(correct) sfxCorrect(); else sfxWrong();

    const fb = document.getElementById("feedback");
    fb.textContent = correct ? t("correctFb") : t("wrongFb");
    fb.className = "feedback " + (correct?"good":"bad");

    state.today.answers.push({
      subject:q.subject, correct,
      prompt:q.prompt, chosen: String(chosen), correctAnswer: String(q.answer)
    });
    adjustLevel(q.subject, correct);
    saveState(state);
    renderBackpack();

    setTimeout(()=>{ renderQuestion(); }, 950);
  }

  function renderDone(){
    const correctCount = state.today.answers.filter(a=>a.correct).length;
    const total = state.today.items.length;
    const stars = getStars(correctCount, total);
    const key = todayStr();
    const completedAt = state.history[key] ? state.history[key].completedAt : Date.now();

    const badgeBanner = justEarnedBadges.length
      ? justEarnedBadges.map(m=>`<div class="badge-banner">${t("newBadge")(BADGE_ICON[m]+" "+t("badgeLabel")(m))}</div>`).join("")
      : "";

    overlayCard.innerHTML = `
      <div class="done">
        <div class="big">⛺</div>
        <h2>${t("doneTitle")}</h2>
        <div class="stars-line pop">${starsHtml(stars)}</div>
        <p>${t("doneScore")(correctCount, total)}<br>${t("timeSpent")(fmtTime(state.today.timeSpent||0))}<br>${t("completedAt")(fmtClock(completedAt))}</p>
        ${badgeBanner}
      </div>
    `;
    justEarnedBadges = [];
    spawnConfetti();
    sfxCelebrate();
  }

  /* ================= Init ================= */
  checkForNewReaction();
  render();
  function bootSyncIfConfigured(){ if(state.pairCode) connectSync(state.pairCode); }
  if(window.CampSync) bootSyncIfConfigured();
  else window.addEventListener("campsync-ready", bootSyncIfConfigured, { once:true });
  tryGreeting();
  document.addEventListener("click", gestureFallback);
  document.addEventListener("touchend", gestureFallback);
  window.__resetCamp = function(){ localStorage.removeItem(STORE_KEY); location.reload(); };
  window.__resetTestData = function(){ localStorage.removeItem("campState_v1_TEST"); location.reload(); };
})();
</script>

</body>
</html>
