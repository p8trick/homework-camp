<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Daily Camp · 每日营地</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Camp">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%235B8C3A'/%3E%3Crect x='20' y='55' width='60' height='30' fill='%238B5A2B'/%3E%3Crect x='40' y='15' width='20' height='40' fill='%23F2C14E'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --grass:#5B8C3A; --grass-dark:#3F6528; --dirt:#8B5A2B; --dirt-dark:#6B4420;
    --stone:#7D7D7D; --sky:#7EC8E3; --diamond:#4FD8E8; --gold:#F2C14E;
    --night:#1C2541; --ink:#22201B; --paper:#FAF7F0; --danger:#D9534F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--sky);
    background-image:linear-gradient(180deg, var(--sky) 0%, var(--sky) 60%, var(--grass) 60%, var(--grass) 100%);
    font-family:'Baloo 2', system-ui, sans-serif; color:var(--ink);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:calc(20px + env(safe-area-inset-top)) 12px 32px; overflow-x:hidden; position:relative;
  }
  .pixel{font-family:'Press Start 2P', monospace;}

  /* ---------- In-flow controls (respect iPhone notch / Dynamic Island, no fixed corners) ---------- */
  .lang-row{ width:100%; max-width:480px; display:flex; justify-content:flex-end; margin-bottom:2px; }
  .lang-btn{
    font-family:'Press Start 2P', monospace; font-size:9px; padding:6px 8px;
    background:var(--paper); border:2px solid var(--ink);
    box-shadow:2px 2px 0 rgba(0,0,0,.3);
    cursor:pointer; color:var(--ink); user-select:none;
  }
  .back-btn{
    display:block; width:100%; max-width:480px; text-align:left;
    font-size:13px; font-weight:800; color:var(--stone);
    background:none; border:none; cursor:pointer;
    margin-bottom:10px; padding:4px 0;
  }

  header{ width:100%; max-width:480px; text-align:center; margin:6px 0 14px; }
  header h1{ font-size:15px; line-height:1.6; margin:0 0 4px; color:var(--paper); text-shadow:2px 2px 0 var(--night); }
  header p{margin:0; font-weight:700; color:var(--night); font-size:14px;}

  #homePage{ width:100%; display:flex; flex-direction:column; align-items:center; }

  .cal-wrap{
    width:100%; max-width:480px; background:rgba(255,255,255,.5);
    border:3px solid var(--ink); padding:10px; margin-bottom:14px;
  }
  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .cal-nav button{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:16px;
    background:var(--paper); border:2px solid var(--ink); width:30px; height:30px; cursor:pointer;
  }
  .cal-nav button:disabled{opacity:.3; cursor:default;}
  .cal-month-label{font-weight:800; font-size:13px;}
  .cal-weekdays, .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-weekdays div{ text-align:center; font-size:10px; font-weight:800; color:var(--stone); }
  .cal-cell{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    position:relative; font-size:11px; font-weight:700; border:2px solid transparent;
  }
  .cal-cell.blank{visibility:hidden;}
  .cal-cell.future{color:rgba(0,0,0,.25);}
  .cal-cell.missed{background:rgba(0,0,0,.08); border-color:rgba(0,0,0,.15);}
  .cal-cell.done{background:var(--gold); border-color:var(--dirt-dark); cursor:pointer; color:var(--ink);}
  .cal-cell.today{outline:2px dashed var(--night); outline-offset:1px; cursor:pointer; background:var(--diamond);}
  .cal-cell .stardot{position:absolute; bottom:1px; font-size:6px;}

  .card{
    width:100%; max-width:480px; background:var(--paper); border:4px solid var(--ink);
    box-shadow:6px 6px 0 rgba(0,0,0,.3); padding:18px; margin-bottom:14px;
  }
  .progress-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-weight:700; font-size:13px; color:var(--stone); }
  .timer-badge{ font-weight:800; font-size:12px; color:var(--night); background:var(--sky); border:2px solid var(--ink); padding:2px 8px; }
  .subject-tag{ display:inline-block; padding:3px 10px; font-size:11px; font-weight:800; border:2px solid var(--ink); background:var(--sky); }
  .subject-tag.math{background:var(--gold);}

  .question-box{ text-align:center; margin:18px 0; }
  .qtext{ font-size:26px; font-weight:800; line-height:1.4; word-break:break-word; }
  .speak-btn{
    display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; margin-top:8px;
    background:var(--diamond); border:3px solid var(--ink); font-size:18px; cursor:pointer;
  }
  .speak-btn:active{transform:translate(2px,2px);}

  .options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
  .opt-btn{
    padding:16px 8px; font-size:20px; font-weight:700; font-family:'Baloo 2', sans-serif;
    background:var(--paper); border:3px solid var(--ink); box-shadow:3px 3px 0 rgba(0,0,0,.25);
    cursor:pointer; min-height:56px;
  }
  .opt-btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,.25);}
  .opt-btn.correct{background:var(--grass); color:var(--paper); border-color:var(--grass-dark);}
  .opt-btn.wrong{background:var(--danger); color:var(--paper);}
  .opt-btn:disabled{opacity:.55;}

  .feedback{ text-align:center; min-height:26px; font-weight:800; font-size:15px; margin-top:10px; }
  .feedback.good{color:var(--grass-dark);} .feedback.bad{color:var(--danger);}

  .backpack{
    width:100%; max-width:480px; background:var(--dirt); border:4px solid var(--ink);
    box-shadow:6px 6px 0 rgba(0,0,0,.3); padding:12px 14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .backpack .label{ color:var(--paper); font-weight:800; font-size:12px; margin-right:4px; flex-basis:100%; }
  .loot{ width:34px; height:34px; display:flex; align-items:center; justify-content:center; font-size:18px; background:var(--night); border:2px solid var(--ink); }
  .loot.empty{opacity:.25;}

  .home{ text-align:center; }
  .streak-big{ font-size:34px; font-weight:800; margin:6px 0 2px; }
  .best-streak{ font-size:12px; font-weight:700; color:var(--stone); margin-bottom:14px; }
  .badge-row{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-bottom:16px; }
  .badge-chip{
    font-size:18px; width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    background:var(--paper); border:2px solid var(--ink); box-shadow:2px 2px 0 rgba(0,0,0,.25);
  }
  .badge-chip.locked{ opacity:.25; filter:grayscale(1); }
  .primary-btn{
    width:100%; padding:18px 10px; font-family:'Baloo 2', sans-serif; font-size:19px; font-weight:800;
    background:var(--gold); border:3px solid var(--ink); box-shadow:4px 4px 0 rgba(0,0,0,.3); cursor:pointer;
  }
  .primary-btn:active{transform:translate(2px,2px); box-shadow:2px 2px 0 rgba(0,0,0,.3);}
  .primary-btn.review-mode{background:var(--diamond);}
  .home .hint{ margin-top:14px; font-size:12px; color:var(--stone); font-weight:700; line-height:1.6; }
  .giveup-link{
    display:inline-block; margin-top:14px; font-size:11px; color:var(--danger);
    text-decoration:underline; background:none; border:none; cursor:pointer; font-weight:700;
  }

  #pageOverlay{
    position:fixed; inset:0; z-index:100;
    background:var(--sky);
    background-image:linear-gradient(180deg, var(--sky) 0%, var(--sky) 55%, var(--grass) 55%, var(--grass) 100%);
    display:none; flex-direction:column; align-items:center; overflow-y:auto;
    padding:calc(20px + env(safe-area-inset-top)) 12px 28px;
  }
  #pageOverlay.show{ display:flex; }

  .review-list{ display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .review-item{ display:flex; align-items:center; gap:10px; border:2px solid var(--ink); padding:8px 10px; font-size:13px; font-weight:700; }
  .review-item .mark{ font-size:16px; flex-shrink:0; }
  .review-item .qp{ flex:1; }
  .review-item .ans{ color:var(--stone); font-size:11px; }
  .review-item.wrong{ background:#FBEAE9; }
  .review-item.right{ background:#EEF6E8; }
  .review-summary{ font-size:13px; font-weight:800; margin-bottom:4px; }
  .review-time{ font-size:12px; color:var(--stone); font-weight:700; margin-bottom:2px; }
  .stars-line{ font-size:26px; letter-spacing:4px; margin:6px 0; }

  .done{ text-align:center; }
  .done .big{font-size:48px; margin:6px 0;}
  .done h2{font-size:18px; color:var(--grass-dark); margin:8px 0;}
  .done p{font-size:14px; color:var(--stone); font-weight:700;}
  .badge-banner{
    background:var(--gold); border:3px solid var(--ink); padding:10px; margin:10px 0;
    font-size:13px; font-weight:800; box-shadow:3px 3px 0 rgba(0,0,0,.25);
  }

  footer{ margin-top:auto; padding-top:20px; font-size:10px; color:rgba(0,0,0,.35); text-align:center; }
</style>
</head>
<body>

<div id="homePage">
  <div class="lang-row"><button class="lang-btn" id="langToggle">中文</button></div>
  <header>
    <h1 class="pixel" id="appTitle">Daily Camp</h1>
  </header>

  <div class="cal-wrap">
    <div class="cal-nav">
      <button id="calPrev">‹</button>
      <span class="cal-month-label" id="calMonthLabel"></span>
      <button id="calNext">›</button>
    </div>
    <div class="cal-weekdays" id="calWeekdays"></div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="card" id="homeCard"></div>

  <footer id="footerNote">v1.5.0 · Saved on this device only · phone sync not set up yet</footer>
</div>

<div id="pageOverlay">
  <button class="back-btn" id="backBtn">← Home</button>
  <div class="card" id="overlayCard"></div>
  <div class="backpack" id="overlayBackpack" style="display:none;">
    <div class="label" id="backpackLabel">Backpack · 0/10</div>
    <div id="lootRow" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ================= Config ================= */
  const KID_NAME = "George";
  const KID_NAME_ZH = "乔治";
  const MILESTONES = [3,7,14,30,60,100];
  const BADGE_ICON = {3:"🔥",7:"⛺",14:"🏕️",30:"🏆",60:"💎",100:"👑"};

  /* ================= i18n ================= */
  const STRINGS = {
    en: {
      appTitle:"Daily Camp", appSub:"",
      streak:n=>`🔥 ${n}`,
      bestStreak:n=>`Best streak: ${n} days`,
      startBtn:"Start Today", continueBtn:(i,t)=>`Continue (${i}/${t})`,
      doneBtnReview:"Done for today · Review",
      hint:"Tap a day on the calendar to review past practice",
      giveUp:"Give up & get new questions",
      giveUpConfirm:"This clears today's progress and gives new questions. Continue?",
      subjectEn:"ENGLISH", subjectMath:"MATH",
      back:"← Home",
      correctFb:"Found treasure! Correct 💎", wrongFb:"Good try — correct answer shown in green",
      doneTitle:"Camp complete for today!",
      doneScore:(c,t)=>`${c} / ${t} correct`,
      timeSpent:s=>`Time spent: ${s}`,
      completedAt:s=>`Finished at: ${s}`,
      yourAnswer:"Your answer: ", correctLabel:"  Correct: ",
      noRecord:"No record for this day",
      weekdays:["S","M","T","W","T","F","S"],
      months:["January","February","March","April","May","June","July","August","September","October","November","December"],
      langBtn:"中文",
      footerNote:v=>`${v} · Saved on this device only · phone sync not set up yet`,
      greeting:`Welcome back, ${KID_NAME}!`,
      newBadge:label=>`🎉 New badge unlocked: ${label}!`,
      badgeLabel:m=>`${m}-Day Streak`
    },
    zh: {
      appTitle:"每日营地", appSub:"DAILY CAMP",
      streak:n=>`🔥 ${n}`,
      bestStreak:n=>`最长连胜：${n} 天`,
      startBtn:"开始今日练习", continueBtn:(i,t)=>`继续今日练习 (${i}/${t})`,
      doneBtnReview:"今日已完成 · 查看今天的复习",
      hint:"点击日历里的日期可以回顾之前学过的内容",
      giveUp:"放弃本次，重新抽题",
      giveUpConfirm:"这会清空今天已做的题，换一批新题。确定吗？",
      subjectEn:"英语 ENGLISH", subjectMath:"数学 MATH",
      back:"← 返回主页",
      correctFb:"挖到宝了！答对啦 💎", wrongFb:"再想想～正确答案已标绿",
      doneTitle:"今天的营地任务完成啦！",
      doneScore:(c,t)=>`答对 ${c} / ${t} 题`,
      timeSpent:s=>`用时：${s}`,
      completedAt:s=>`完成时间：${s}`,
      yourAnswer:"你的答案：", correctLabel:"　正确答案：",
      noRecord:"这天还没有记录哦",
      weekdays:["日","一","二","三","四","五","六"],
      months:["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"],
      langBtn:"EN",
      footerNote:v=>`${v} · 仅保存在本机 · 手机同步尚未开启`,
      greeting:`欢迎回来${KID_NAME_ZH}`,
      newBadge:label=>`🎉 解锁新徽章：${label}！`,
      badgeLabel:m=>`连胜 ${m} 天`
    }
  };
  const VERSION = "v1.5.0";
  function t(key){ return STRINGS[state.lang][key]; }

  /* ================= Storage ================= */
  const STORE_KEY = "campState_v1";
  const pad2 = n => String(n).padStart(2,"0");
  const keyOf = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const todayStr = () => keyOf(new Date());

  function loadState(){
    let raw;
    try{ raw = JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){ raw = null; }
    if(!raw){
      raw = {
        lang:"en", level:{ en:1, math:1 }, streak:0, bestStreak:0, badges:[],
        lastCompleteDate:null, history:{},
        today:{ date:null, items:[], answers:[], timeSpent:0 }
      };
    }
    if(!raw.lang) raw.lang = "en";
    if(raw.bestStreak == null) raw.bestStreak = raw.streak||0;
    if(!raw.badges) raw.badges = [];
    if(raw.today.timeSpent == null) raw.today.timeSpent = 0;
    return raw;
  }
  function saveState(s){ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }

  let state = loadState();
  let justEarnedBadges = []; // transient, shown once on the Done screen

  /* ================= Question banks (leveled) ================= */
  const SIGHT_WORDS = [
    ["cat","🐱"], ["dog","🐶"], ["sun","☀️"], ["book","📖"], ["fish","🐟"],
    ["star","⭐"], ["tree","🌳"], ["ball","⚽"], ["milk","🥛"], ["bird","🐦"],
    ["car","🚗"], ["house","🏠"], ["apple","🍎"], ["moon","🌙"], ["rain","🌧️"]
  ];
  const MISSING_LETTER = [
    ["c_t","a","o","cat"], ["d_g","o","e","dog"], ["s_n","u","i","sun"],
    ["r_n","u","a","run"], ["b_g","i","u","big"], ["h_t","o","a","hot"],
    ["p_g","i","u","pig"], ["c_p","u","a","cup"]
  ];
  const SENTENCE_FILL = [
    ["I ___ a book.", "have", "has"], ["She ___ happy.", "is", "am"],
    ["They ___ playing.", "are", "is"], ["We ___ friends.", "are", "am"],
    ["He ___ to school.", "goes", "go"], ["I ___ like pizza.", "do", "does"]
  ];

  function genEnglish(level){
    if(level <= 2){
      const [word, emoji] = SIGHT_WORDS[Math.floor(Math.random()*SIGHT_WORDS.length)];
      let wrongEmojis = SIGHT_WORDS.filter(w=>w[1]!==emoji).sort(()=>Math.random()-0.5).slice(0,3).map(w=>w[1]);
      let opts = [emoji, ...wrongEmojis].sort(()=>Math.random()-0.5);
      return { subject:"en", prompt: word, speak: word, options: opts, answer: emoji, big:true };
    } else if(level <= 4){
      const [word, right, wrong, full] = MISSING_LETTER[Math.floor(Math.random()*MISSING_LETTER.length)];
      let opts = [right, wrong].sort(()=>Math.random()-0.5);
      return { subject:"en", prompt: word, speak: full, options: opts, answer: right };
    } else {
      const [sentence, right, wrong] = SENTENCE_FILL[Math.floor(Math.random()*SENTENCE_FILL.length)];
      let opts = [right, wrong].sort(()=>Math.random()-0.5);
      return { subject:"en", prompt: sentence, speak: sentence.replace("___", right), options: opts, answer: right };
    }
  }

  function genMath(level){
    function mkAdd(max){
      const a = 1+Math.floor(Math.random()*max), b = 1+Math.floor(Math.random()*max);
      return { prompt:`${a} + ${b} = ?`, answer:(a+b) };
    }
    function mkSub(max){
      let a = 1+Math.floor(Math.random()*max), b = 1+Math.floor(Math.random()*max);
      if(b>a) [a,b]=[b,a];
      return { prompt:`${a} - ${b} = ?`, answer:(a-b) };
    }
    function mkSkip(){
      const step = [2,5,10][Math.floor(Math.random()*3)];
      const start = step*(1+Math.floor(Math.random()*5));
      return { prompt:`${start}, ${start+step}, ${start+step*2}, ?`, answer:(start+step*3) };
    }
    let q;
    if(level === 1) q = mkAdd(10);
    else if(level === 2) q = mkSub(10);
    else if(level === 3) q = mkAdd(50);
    else if(level === 4) q = Math.random()<0.5 ? mkSub(50) : mkSkip();
    else q = Math.random()<0.5 ? mkAdd(100) : mkSub(100);

    const correct = q.answer;
    let wrongOpts = new Set();
    while(wrongOpts.size < 3){
      let delta = (1+Math.floor(Math.random()*5)) * (Math.random()<0.5?-1:1);
      let w = correct + delta;
      if(w >= 0 && w !== correct) wrongOpts.add(w);
    }
    let opts = [correct, ...wrongOpts].sort(()=>Math.random()-0.5);
    return { subject:"math", prompt:q.prompt, speak:null, options:opts.map(String), answer:String(correct) };
  }

  function buildTodaySet(){
    const items = [];
    for(let i=0;i<5;i++) items.push(genEnglish(state.level.en));
    for(let i=0;i<5;i++) items.push(genMath(state.level.math));
    const en = items.slice(0,5), math = items.slice(5);
    const mixed = [];
    for(let i=0;i<5;i++){ mixed.push(en[i]); mixed.push(math[i]); }
    return mixed;
  }

  /* ================= Day bootstrap ================= */
  if(state.today.date !== todayStr()){
    state.today = { date: todayStr(), items: buildTodaySet(), answers: [], timeSpent:0 };
    saveState(state);
  }

  /* ================= TTS ================= */
  let voicesReady = false;
  if("speechSynthesis" in window){
    window.speechSynthesis.onvoiceschanged = ()=>{ voicesReady = true; };
  }
  function speak(text, lang){
    if(!text || !("speechSynthesis" in window)) return;
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang || "en-US";
      u.rate = 0.85;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function playGreeting(){
    if(!("speechSynthesis" in window)) return;
    const msg = t("greeting");
    const lang = state.lang === "zh" ? "zh-CN" : "en-US";
    const attempt = ()=>speak(msg, lang);
    if(window.speechSynthesis.getVoices().length || voicesReady) attempt();
    else setTimeout(attempt, 300);
  }

  /* ================= Timer ================= */
  let timerHandle = null;
  let sessionStartTs = null;
  function currentElapsedSeconds(){
    const base = state.today.timeSpent || 0;
    const live = sessionStartTs ? Math.floor((Date.now()-sessionStartTs)/1000) : 0;
    return base + live;
  }
  function fmtTime(sec){
    const m = Math.floor(sec/60), s = sec%60;
    return `${pad2(m)}:${pad2(s)}`;
  }
  function fmtClock(ms){
    if(!ms) return "--:--";
    const d = new Date(ms);
    return d.toLocaleTimeString(state.lang==="zh" ? "zh-CN" : "en-US",
      state.lang==="zh" ? {hour:"2-digit", minute:"2-digit", hour12:false} : {hour:"numeric", minute:"2-digit", hour12:true});
  }
  function startTimer(){
    if(sessionStartTs) return;
    sessionStartTs = Date.now();
    timerHandle = setInterval(()=>{
      const el = document.getElementById("liveTimer");
      if(el) el.textContent = "⏱ " + fmtTime(currentElapsedSeconds());
    }, 1000);
  }
  function stopTimer(){
    if(sessionStartTs){
      state.today.timeSpent = (state.today.timeSpent||0) + Math.floor((Date.now()-sessionStartTs)/1000);
      sessionStartTs = null;
      saveState(state);
    }
    if(timerHandle){ clearInterval(timerHandle); timerHandle = null; }
  }
  window.addEventListener("pagehide", stopTimer);
  window.addEventListener("visibilitychange", ()=>{ if(document.hidden) stopTimer(); });

  /* ================= Stars ================= */
  function getStars(correct, total){
    if(correct >= total) return 3;
    if(correct >= Math.ceil(total*0.8)) return 2;
    if(correct >= Math.ceil(total*0.5)) return 1;
    return 0;
  }
  function starsHtml(n){
    let s = "";
    for(let i=0;i<3;i++) s += i<n ? "⭐" : "☆";
    return s;
  }

  /* ================= DOM refs ================= */
  const homeCard = document.getElementById("homeCard");
  const overlayCard = document.getElementById("overlayCard");
  const pageOverlay = document.getElementById("pageOverlay");
  const backBtn = document.getElementById("backBtn");
  const overlayBackpack = document.getElementById("overlayBackpack");
  const lootRow = document.getElementById("lootRow");
  const backpackLabel = document.getElementById("backpackLabel");
  const appTitleEl = document.getElementById("appTitle");
  const langToggle = document.getElementById("langToggle");
  const footerNote = document.getElementById("footerNote");
  const calGrid = document.getElementById("calGrid");
  const calWeekdays = document.getElementById("calWeekdays");
  const calMonthLabel = document.getElementById("calMonthLabel");
  const calPrev = document.getElementById("calPrev");
  const calNext = document.getElementById("calNext");

  const LOOT_ICONS = ["💎","💎","🥇","💎","🥇","💎","💎","🥇","💎","🏆"];

  let view = "home";
  let reviewKey = null;

  const now0 = new Date();
  let calYear = now0.getFullYear();
  let calMonth = now0.getMonth();

  function goHome(){ stopTimer(); view = "home"; render(); }
  function showQuiz(){ view = "quiz"; startTimer(); render(); }

  backBtn.addEventListener("click", goHome);

  langToggle.addEventListener("click", ()=>{
    state.lang = state.lang === "en" ? "zh" : "en";
    saveState(state);
    render();
  });

  calPrev.addEventListener("click", ()=>{
    calMonth--; if(calMonth<0){ calMonth=11; calYear--; }
    renderCalendar();
  });
  calNext.addEventListener("click", ()=>{
    const isCurrent = calYear===now0.getFullYear() && calMonth===now0.getMonth();
    if(isCurrent) return;
    calMonth++; if(calMonth>11){ calMonth=0; calYear++; }
    renderCalendar();
  });

  function render(){
    appTitleEl.innerHTML = t("appTitle") + (t("appSub") ? "<br>"+t("appSub") : "");
    langToggle.textContent = t("langBtn");
    footerNote.textContent = t("footerNote")(VERSION);
    backBtn.textContent = t("back");

    const isOverlay = (view === "quiz" || view === "review" || view === "done");
    pageOverlay.classList.toggle("show", isOverlay);
    overlayBackpack.style.display = (view === "quiz") ? "flex" : "none";

    if(view === "home") renderHome();
    else if(view === "quiz") renderQuestion();
    else if(view === "review") renderReview(reviewKey);
    else if(view === "done") renderDone();

    renderCalendar();
    if(view === "quiz") renderBackpack();
  }

  function renderCalendar(){
    calMonthLabel.textContent = `${t("months")[calMonth]} ${calYear}`;
    calWeekdays.innerHTML = t("weekdays").map(d=>`<div>${d}</div>`).join("");
    const isCurrentMonth = calYear===now0.getFullYear() && calMonth===now0.getMonth();
    calNext.disabled = isCurrentMonth;

    calGrid.innerHTML = "";
    const firstWeekday = new Date(calYear, calMonth, 1).getDay();
    const numDays = new Date(calYear, calMonth+1, 0).getDate();

    for(let i=0;i<firstWeekday;i++){
      const blank = document.createElement("div");
      blank.className = "cal-cell blank";
      calGrid.appendChild(blank);
    }

    for(let d=1; d<=numDays; d++){
      const cellDate = new Date(calYear, calMonth, d);
      const key = keyOf(cellDate);
      const isToday = key === todayStr();
      const isFuture = cellDate > new Date(now0.getFullYear(),now0.getMonth(),now0.getDate());
      const record = state.history[key];
      const todayLiveDone = isToday && state.today.answers.length >= state.today.items.length;

      const cell = document.createElement("div");
      let cls = "cal-cell";
      let inner = `${d}`;

      if(isFuture){
        cls += " future";
      } else if(record && record.done){
        cls += " done";
        inner += `<span class="stardot">${"⭐".repeat(record.stars||0)}</span>`;
        cell.addEventListener("click", ()=>{ reviewKey = key; view = "review"; render(); });
      } else if(isToday){
        cls += " today";
        if(todayLiveDone){
          cell.addEventListener("click", ()=>{ reviewKey = key; view = "review"; render(); });
        } else {
          cell.addEventListener("click", showQuiz);
        }
      } else {
        cls += " missed";
      }
      cell.className = cls;
      cell.innerHTML = inner;
      calGrid.appendChild(cell);
    }
  }

  function renderBackpack(){
    lootRow.innerHTML = "";
    const correctCount = state.today.answers.filter(a=>a.correct).length;
    backpackLabel.textContent = `${state.lang==='zh'?'今日背包':'Backpack'} · ${correctCount}/10`;
    for(let i=0;i<10;i++){
      const div = document.createElement("div");
      div.className = "loot" + (i < correctCount ? "" : " empty");
      div.textContent = i < correctCount ? LOOT_ICONS[i] : "·";
      lootRow.appendChild(div);
    }
  }

  function renderHome(){
    const idx = state.today.answers.length;
    const total = state.today.items.length;
    const todayDone = idx >= total;
    let btnLabel, btnClass = "primary-btn", onClick;

    if(todayDone){
      btnLabel = t("doneBtnReview");
      btnClass += " review-mode";
      onClick = ()=>{ reviewKey = todayStr(); view = "review"; render(); };
    } else if(idx > 0){
      btnLabel = t("continueBtn")(idx, total);
      onClick = showQuiz;
    } else {
      btnLabel = t("startBtn");
      onClick = showQuiz;
    }

    const badgeRow = MILESTONES.map(m=>{
      const earned = state.badges.includes(m);
      return `<div class="badge-chip ${earned?'':'locked'}" title="${t('badgeLabel')(m)}">${BADGE_ICON[m]}</div>`;
    }).join("");

    homeCard.innerHTML = `
      <div class="home">
        <div class="streak-big">${t("streak")(state.streak)}</div>
        <div class="best-streak">${t("bestStreak")(state.bestStreak)}</div>
        <div class="badge-row">${badgeRow}</div>
        <button class="${btnClass}" id="startBtn">${btnLabel}</button>
        <p class="hint">${t("hint")}</p>
        ${(idx > 0 && !todayDone) ? `<button class="giveup-link" id="giveUpBtn">${t("giveUp")}</button>` : ""}
      </div>
    `;
    document.getElementById("startBtn").addEventListener("click", onClick);
    const giveUpBtn = document.getElementById("giveUpBtn");
    if(giveUpBtn){
      giveUpBtn.addEventListener("click", ()=>{
        if(confirm(t("giveUpConfirm"))){
          state.today = { date: todayStr(), items: buildTodaySet(), answers: [], timeSpent: state.today.timeSpent||0 };
          saveState(state);
          render();
        }
      });
    }
  }

  function renderReview(key){
    const isTodayLive = key === todayStr() && !(state.history[key]);
    const record = isTodayLive
      ? { correct: state.today.answers.filter(a=>a.correct).length, items: state.today.answers, timeSpent: state.today.timeSpent,
          stars: getStars(state.today.answers.filter(a=>a.correct).length, state.today.items.length||10), completedAt: null }
      : state.history[key];
    if(!record){ goHome(); return; }
    const total = (record.items||[]).length || 10;
    const rows = (record.items||[]).map(a=>{
      const cls = a.correct ? "right" : "wrong";
      const mark = a.correct ? "✅" : "❌";
      return `
        <div class="review-item ${cls}">
          <span class="mark">${mark}</span>
          <div class="qp">
            <div>${a.prompt}</div>
            <div class="ans">${t("yourAnswer")}${a.chosen}${a.correct ? "" : t("correctLabel") + a.correctAnswer}</div>
          </div>
        </div>`;
    }).join("");
    overlayCard.innerHTML = `
      <div class="review-summary">${key} · ${t("doneScore")(record.correct, total)}</div>
      <div class="stars-line">${starsHtml(record.stars||0)}</div>
      <div class="review-time">${t("timeSpent")(fmtTime(record.timeSpent||0))}</div>
      <div class="review-time">${t("completedAt")(fmtClock(record.completedAt))}</div>
      <div class="review-list">${rows || `<p>${t("noRecord")}</p>`}</div>
    `;
  }

  function updateStreakOnComplete(){
    const key = todayStr();
    if(state.history[key] && state.history[key].done) return;
    stopTimer();
    const correctCount = state.today.answers.filter(a=>a.correct).length;
    const total = state.today.items.length;
    const nowMs = Date.now();
    state.history[key] = {
      done:true, correct: correctCount, items: state.today.answers.slice(),
      timeSpent: state.today.timeSpent||0, stars: getStars(correctCount, total),
      completedAt: nowMs
    };
    const y = new Date(); y.setDate(y.getDate()-1);
    const yKey = keyOf(y);
    if(state.history[yKey] && state.history[yKey].done){
      state.streak += 1;
    } else {
      state.streak = 1;
    }
    if(state.streak > state.bestStreak) state.bestStreak = state.streak;

    justEarnedBadges = MILESTONES.filter(m => state.streak >= m && !state.badges.includes(m));
    justEarnedBadges.forEach(m => state.badges.push(m));

    state.lastCompleteDate = key;
    saveState(state);
  }

  function adjustLevel(subject, wasCorrect){
    const comboKey = subject+"Combo";
    state.today[comboKey] = state.today[comboKey] || 0;
    if(wasCorrect){
      state.today[comboKey] += 1;
      if(state.today[comboKey] >= 4 && state.level[subject] < 5){
        state.level[subject] += 1;
        state.today[comboKey] = 0;
      }
    } else {
      state.today[comboKey] = 0;
      if(state.level[subject] > 1) state.level[subject] -= 1;
    }
  }

  function renderQuestion(){
    const idx = state.today.answers.length;
    const total = state.today.items.length;

    if(idx >= total){
      updateStreakOnComplete();
      view = "done";
      renderDone();
      return;
    }

    startTimer();
    const q = state.today.items[idx];
    overlayCard.innerHTML = `
      <div class="progress-row">
        <span class="subject-tag ${q.subject==='math'?'math':''}">${q.subject==='math'?t("subjectMath"):t("subjectEn")}</span>
        <span>${idx+1} / ${total}</span>
        <span class="timer-badge" id="liveTimer">⏱ ${fmtTime(currentElapsedSeconds())}</span>
      </div>
      <div class="question-box">
        <div class="qtext" style="${q.big?'font-size:40px;':''}">${q.prompt}</div>
        ${q.speak ? `<div class="speak-btn" id="speakBtn">🔊</div>` : ""}
      </div>
      <div class="options" id="optionsRow"></div>
      <div class="feedback" id="feedback"></div>
    `;

    if(q.speak){
      document.getElementById("speakBtn").addEventListener("click", ()=>speak(q.speak, "en-US"));
    }

    const optionsRow = document.getElementById("optionsRow");
    q.options.forEach(opt=>{
      const btn = document.createElement("button");
      btn.className = "opt-btn";
      btn.textContent = opt;
      btn.addEventListener("click", ()=>handleAnswer(q, opt, btn, optionsRow));
      optionsRow.appendChild(btn);
    });
  }

  function handleAnswer(q, chosen, btnEl, rowEl){
    const correct = (String(chosen) === String(q.answer));
    Array.from(rowEl.children).forEach(b=>b.disabled = true);
    btnEl.classList.add(correct?"correct":"wrong");
    if(!correct){
      Array.from(rowEl.children).forEach(b=>{
        if(String(b.textContent)===String(q.answer)) b.classList.add("correct");
      });
    }
    const fb = document.getElementById("feedback");
    fb.textContent = correct ? t("correctFb") : t("wrongFb");
    fb.className = "feedback " + (correct?"good":"bad");

    state.today.answers.push({
      subject:q.subject, correct,
      prompt:q.prompt, chosen: String(chosen), correctAnswer: String(q.answer)
    });
    adjustLevel(q.subject, correct);
    saveState(state);
    renderBackpack();

    setTimeout(()=>{ renderQuestion(); }, 950);
  }

  function renderDone(){
    const correctCount = state.today.answers.filter(a=>a.correct).length;
    const total = state.today.items.length;
    const stars = getStars(correctCount, total);
    const key = todayStr();
    const completedAt = state.history[key] ? state.history[key].completedAt : Date.now();

    const badgeBanner = justEarnedBadges.length
      ? justEarnedBadges.map(m=>`<div class="badge-banner">${t("newBadge")(BADGE_ICON[m]+" "+t("badgeLabel")(m))}</div>`).join("")
      : "";

    overlayCard.innerHTML = `
      <div class="done">
        <div class="big">⛺</div>
        <h2>${t("doneTitle")}</h2>
        <div class="stars-line">${starsHtml(stars)}</div>
        <p>${t("doneScore")(correctCount, total)}<br>${t("timeSpent")(fmtTime(state.today.timeSpent||0))}<br>${t("completedAt")(fmtClock(completedAt))}</p>
        ${badgeBanner}
      </div>
    `;
    justEarnedBadges = [];
  }

  /* ================= Init ================= */
  render();
  playGreeting();
  window.__resetCamp = function(){ localStorage.removeItem(STORE_KEY); location.reload(); };
})();
</script>
